# ===================================================================
# LEVEL 2 INTEGRATION TEST PROPERTIES (TEST PROFILE)
# Database: bonsai_shop_test ONLY
# ===================================================================

# Database Configuration (Must explicitly target bonsai_shop_test with auto-creation flag)
spring.datasource.url=jdbc:mysql://localhost:3306/bonsai_shop_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=123456

# Flyway Configuration (Must explicitly target bonsai_shop_test with auto-creation flag)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:mysql://localhost:3306/bonsai_shop_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
spring.flyway.user=root
spring.flyway.password=123456

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail Mocking Settings
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test-mail-user@example.com
spring.mail.password=test-mail-pass
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000

# Dummy VNPay Test Credentials
vnp.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp.tmn-code=TEST_TMN_CODE
vnp.hash-secret=TEST_HASH_SECRET_1234567890ABCDEF
vnp.return-url=http://localhost:8080/vnpay/payment-callback

# Order Expiration Threshold
order.expiration.online-minutes=15
order.expiration.in-person-minutes=1440

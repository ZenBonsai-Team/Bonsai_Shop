<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .cart-container {
            margin-top: 60px;
            margin-bottom: 80px;
        }
        .cart-header-title {
            font-family: var(--font-serif);
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .cart-table th {
            background-color: var(--bg-beige);
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 15px;
        }
        .cart-table td {
            vertical-align: middle;
            padding: 20px 15px;
        }
        .cart-prod-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .cart-prod-name {
            font-family: var(--font-sans);
            font-weight: 600;
            color: var(--text-dark);
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .cart-prod-name:hover {
            color: var(--accent-color);
        }
        .cart-price {
            font-weight: 600;
            color: var(--accent-color);
        }
        .btn-remove-item {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-remove-item:hover {
            color: #c53030;
            transform: scale(1.1);
        }
        .cart-summary-box {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: var(--shadow-subtle);
        }
        .cart-summary-title {
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        .summary-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }
        .btn-checkout {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 4px;
            transition: var(--transition);
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .btn-checkout:hover {
            background-color: var(--primary-hover);
            color: white;
        }
        .empty-cart-state {
            text-align: center;
            padding: 80px 20px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .empty-cart-icon {
            font-size: 4rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}" th:with="activePage='cart'"></div>

<div class="container cart-container">
    <h2 class="cart-header-title"><i class="fa-solid fa-bag-shopping me-2"></i> Giỏ hàng của bạn</h2>

    <div class="row" id="cartMainContent">
        <!-- Left Column: Items List -->
        <div class="col-lg-8 mb-4">
            <div class="table-responsive bg-white rounded-3 border">
                <table class="table cart-table mb-0">
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th style="width: 150px;">Đơn giá</th>
                            <th style="width: 120px; text-align: center;">Số lượng</th>
                            <th style="width: 100px; text-align: center;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Ajax items will be rendered here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Column: Summary -->
        <div class="col-lg-4">
            <div class="cart-summary-box">
                <h3 class="cart-summary-title">Tóm tắt đơn hàng</h3>
                <div class="summary-row">
                    <span>Tạm tính:</span>
                    <span id="cartSubtotal">0 đ</span>
                </div>
                <div class="summary-row">
                    <span>Phí vận chuyển:</span>
                    <span class="text-success">Liên hệ sau (Tính riêng)</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Tổng cộng:</span>
                    <strong id="cartTotal">0 đ</strong>
                </div>
                <div class="mt-4">
                    <a href="/checkout" class="btn-checkout">Tiến hành đặt hàng</a>
                    <a href="/marketplace" class="btn btn-outline-secondary w-100 mt-2">Tiếp tục mua sắm</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty Giỏ Hàng State -->
    <div class="empty-cart-state d-none" id="emptyCartState">
        <div class="empty-cart-icon"><i class="fa-solid fa-inbox"></i></div>
        <h4>Giỏ hàng của bạn đang trống!</h4>
        <p class="text-muted">Hãy lướt Bonsai Marketplace để tìm kiếm tác phẩm ưng ý.</p>
        <a href="/marketplace" class="btn btn-success mt-3 px-4">Đến Marketplace</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>

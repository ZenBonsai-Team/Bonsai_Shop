<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Wishlist - BSMS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/wishlist.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}" th:with="activePage='wishlist'"></div>

<main class="container wishlist-container">
    <h2 class="wishlist-header-title">
        <i class="fa-solid fa-heart me-2"></i> Wishlist của bạn
    </h2>

    <div class="wishlist-grid" id="wishlistGrid"></div>

    <div class="empty-wishlist-state d-none" id="emptyWishlistState">
        <div class="empty-wishlist-icon"><i class="fa-regular fa-heart"></i></div>
        <h4>Wishlist của bạn đang trống</h4>
        <p class="text-muted">Lưu lại các tác phẩm bonsai bạn quan tâm để xem lại sau.</p>
        <a href="/marketplace" class="btn btn-success mt-3 px-4">Đến Marketplace</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

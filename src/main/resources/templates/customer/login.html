<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Đăng nhập - BSMS', '/css/login.css')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="login-page-wrapper">
<div class="login-container">

    <!-- LOGO -->
    <div class="login-logo">
        <div style="font-size: 50px;">🌿</div>
        <h1>Bonsai Shop</h1>
        <p>Đăng nhập để tiếp tục</p>
    </div>

    <!-- THÔNG BÁO -->
    <div th:if="${error1}" th:text="${error1}" class="alert alert-error"></div>
     <div th:if="${success}" th:text="${success}" class="alert alert-success"></div>
    <div th:if="${param.logout}" class="alert alert-success">
        ✅ Đăng xuất thành công!
    </div>

    <!-- FORM -->
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label>📧 Email</label>
            <label>
                <input type="email" name="username" placeholder="Nhập email của bạn" required/>
            </label>
        </div>

        <div class="form-group">
            <label>🔒 Mật khẩu</label>
            <div class="input-wrapper">
                <label for="password"></label>
                <input type="password" name="password" id="password" placeholder="Nhập mật khẩu" required/>
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>
    </form>

    <div class="register-link">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
    </div>

    <div style="text-align:center; margin-top:10px;">
        <a th:href="@{/forgot-password}" style="color:#2d6a4f; font-size:14px;">
            Quên mật khẩu?
        </a>
    </div>

</div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/login.js}"></script>
</body>
</html>

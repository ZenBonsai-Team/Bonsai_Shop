<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bonsai Shop</title>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>

<div class="login-wrapper">

    <!-- BÊN TRÁI: ẢNH + TAGLINE -->
    <div class="login-left">
        <div class="brand">
            <div class="brand-icon">🌿</div>
            <span class="brand-name">Bonsai</span>
        </div>

        <div class="tagline">
            <div class="tagline-line"></div>
            <h2>Patience, simplicity, and the art of becoming.</h2>
            <p class="tagline-sub">THE WAY OF BONSAI</p>
            <div class="tagline-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- BÊN PHẢI: FORM ĐĂNG NHẬP -->
    <div class="login-right">
        <div class="login-form-container">

            <p class="welcome-back">WELCOME BACK</p>
            <h1 class="login-title">Sign in to your garden</h1>

            <!-- THÔNG BÁO LỖI -->
            <div th:if="${param.error}" class="alert alert-error">
                ❌ Email hoặc mật khẩu không đúng!
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                ✅ Đăng xuất thành công!
            </div>

            <!-- FORM -->
            <form method="post" th:action="@{/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="username"
                           placeholder="you@example.com" required/>
                </div>

                <div class="form-group">
                    <div class="password-label-row">
                        <label for="password">Password</label>
                        <a th:href="@{/forgot-password}" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-password-wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="••••••••" required/>
                        <span class="toggle-eye" id="togglePassword">👁</span>
                    </div>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="remember-me"/>
                        <span class="custom-checkbox"></span>
                        Remember me for 30 days
                    </label>
                </div>

                <button type="submit" class="btn-signin">
                    Sign in →
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <button class="btn-social">
                    <img src="https://www.google.com/favicon.ico" alt="Google" width="18"/>
                    Google
                </button>
                <button class="btn-social">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    GitHub
                </button>
            </div>

            <p class="register-link">
                Don't have an account?
                <a th:href="@{/register}">Create one</a>
            </p>

        </div>
    </div>

</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bonsai Shop</title>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>

<div class="login-wrapper">

    <!-- BÊN TRÁI: ẢNH + TAGLINE -->
    <div class="login-left">
        <div class="brand">
            <img th:src="@{/images/logo.png}" alt="Logo" style="width: 32px; height: 32px; border-radius: 6px; object-fit: contain;">
            <span class="brand-name" style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: #ffffff;">Bonsai Shop</span>
        </div>

        <div class="tagline">
            <div class="tagline-line"></div>
            <h2>Patience, simplicity, and the art of becoming.</h2>
            <p class="tagline-sub">THE WAY OF BONSAI</p>
        </div>
    </div>

    <!-- BÊN PHẢI: FORM ĐĂNG NHẬP -->
    <div class="login-right">
        <div class="login-form-container">

            <p class="welcome-back">WELCOME BACK</p>
            <h1 class="login-title">Sign in to your garden</h1>

            <!-- THÔNG BÁO LỖI -->
            <div th:if="${param.error}" class="alert alert-error">
                ❌ Email hoặc mật khẩu không đúng!
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                ✅ Đăng xuất thành công!
            </div>

            <!-- FORM -->
            <form method="post" th:action="@{/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="username"
                           placeholder="you@example.com" required/>
                </div>

                <div class="form-group">
                    <div class="password-label-row">
                        <label for="password">Password</label>
                        <a th:href="@{/forgot-password}" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-password-wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="••••••••" required/>
                        <span class="toggle-eye" id="togglePassword">👁</span>
                    </div>
                </div>
                <button type="submit" class="btn-signin">
                    Sign in →
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <a href="/oauth2/authorization/google" class="btn-social">
                    <img src="https://www.google.com/favicon.ico" alt="Google" width="18"/>
                    Google
                </a>
            </div>

            <p class="register-link">
                Don't have an account?
                <a th:href="@{/register}">Create one</a>
            </p>

        </div>
    </div>

</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận OTP - Bonsai</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500;600&display=swap">

    <link rel="stylesheet" th:href="@{/css/verify-otp.css}">
</head>
<body>

<div class="otp-card">


    <h1>Nhập mã OTP</h1>

    <p class="description">
        Mã OTP đã được gửi đến email của bạn.
        Vui lòng kiểm tra và nhập mã 6 số bên dưới.
    </p>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form method="post"
          th:action="@{/verify-otp-to-reset-password}">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <input type="hidden"
               name="email"
               th:value="${email}"/>

        <!-- Input thật -->
        <input type="hidden"
               id="otpCode"
               name="otpCode">

        <div class="otp-container">

            <input class="otp-input" maxlength="1">
            <input class="otp-input" maxlength="1">
            <input class="otp-input" maxlength="1">
            <input class="otp-input" maxlength="1">
            <input class="otp-input" maxlength="1">
            <input class="otp-input" maxlength="1">

        </div>

        <button class="btn-submit">
            XÁC NHẬN OTP
        </button>
    </form>

    <form method="post"
          th:action="@{/resend-otp-reset}">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <input type="hidden"
               name="email"
               th:value="${email}"/>

        <button class="btn-resend">
            ↻ Gửi lại mã OTP
        </button>
    </form>

</div>

<script>

    const inputs =
        document.querySelectorAll(".otp-input");

    const hiddenInput =
        document.getElementById("otpCode");

    inputs.forEach((input, index) => {

        input.addEventListener("input", () => {

            if (input.value.length === 1 &&
                index < inputs.length - 1) {

                inputs[index + 1].focus();
            }

            hiddenInput.value =
                Array.from(inputs)
                    .map(i => i.value)
                    .join("");
        });

        input.addEventListener(
            "keydown",
            (e) => {

                if (
                    e.key === "Backspace"
                    && input.value === ""
                    && index > 0
                ) {
                    inputs[index - 1].focus();
                }
            }
        );
    });

</script>

</body>
</html>

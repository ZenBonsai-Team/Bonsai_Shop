<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - ZenBonsai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                    linear-gradient(rgba(6, 33, 15, 0.68), rgba(6, 33, 15, 0.68)),
                    url("/images/register-bg.png") center/cover no-repeat;
            color: #061b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .card {
            width: 560px;
            padding: 42px 46px;
            background:
                    linear-gradient(rgba(247, 246, 241, 0.72), rgba(247, 246, 241, 0.72)),
                    url("/images/register-bg.png") center/cover no-repeat;
            backdrop-filter: blur(4px);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            color: #06210f;
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .divider {
            width: 70px;
            height: 1px;
            background: rgba(6, 33, 15, 0.35);
            margin: 10px auto 30px;
        }

        h1 {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            font-weight: 500;
            color: #06210f;
            margin-bottom: 16px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #50584f;
            font-weight: 600;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding: 12px 0 13px;
            border: none;
            border-bottom: 1px solid rgba(6, 33, 15, 0.35);
            background: transparent;
            font-size: 16px;
            outline: none;
            color: #061b0d;
        }

        .password-box input::placeholder {
            color: rgba(6, 33, 15, 0.75);
        }

        .password-box input:focus {
            border-bottom-color: #06210f;
        }

        .eye {
            position: absolute;
            right: 4px;
            top: 2px;
            cursor: pointer;
            color: rgba(6, 33, 15, 0.65);
            font-size: 18px;
        }

        .btn-submit {
            width: 100%;
            height: 58px;
            margin-top: 25px;
            padding: 0;
            border: none;
            background: #06210f;
            color: white;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-submit:hover {
            background: #0b3519;
            transform: translateY(-1px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #555;
            text-decoration: none;
            font-size: 16px;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .back:hover {
            color: #06210f;
        }

        .leaf {
            text-align: center;
            margin-top: 50px;
            font-size: 42px;
            color: rgba(6, 33, 15, 0.15);
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .card {
                width: 100%;
                padding: 35px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .logo {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>



<div class="card">

    <div class="logo">Minh Kỷ Garden</div>
    <div class="divider"></div>

    <h1>Đặt lại mật khẩu</h1>

    <p class="subtitle">
        Vui lòng nhập mật khẩu mới của bạn bên dưới.
    </p>

    <div th:if="${error}"
         th:text="${error}"
         class="alert-error"></div>

    <form method="post" th:action="@{/reset-password}">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <input type="hidden"
               name="email"
               th:value="${email}"/>

        <div class="form-group">
            <label>🔒 Mật khẩu mới</label>

            <div class="password-box">
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       required>

                <span class="eye"
                      onclick="togglePassword('newPassword')">
                    👁
                </span>
            </div>
        </div>

        <div class="form-group">
            <label>🔁 Xác nhận mật khẩu mới</label>

            <div class="password-box">
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       required>

                <span class="eye"
                      onclick="togglePassword('confirmPassword')">
                    👁
                </span>
            </div>
        </div>

        <button class="btn-submit" type="submit">
            CẬP NHẬT MẬT KHẨU
        </button>
    </form>

    <a th:href="@{/login}" class="back">
        ← Quay lại đăng nhập
    </a>

    <div class="leaf">🍃</div>
</div>

<script>
    function togglePassword(id) {
        let input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>

</body>
</html>

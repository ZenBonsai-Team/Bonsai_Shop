<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - ZenBonsai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                    linear-gradient(rgba(255,255,255,.92),
                    rgba(255,255,255,.92));
            font-family: 'Inter', sans-serif;
            position:relative;
            overflow:hidden;
        }

        /* Cây bonsai bên trái */
        .side-image{
            position:absolute;
            left:50px;
            bottom:30px;
            opacity:.15;
        }

        .side-image img{
            width:270px;
        }

        .card{
            width:540px;
            background:white;
            padding:50px 42px;
            box-shadow:0 10px 40px rgba(0,0,0,.08);
        }

        .logo{
            text-align:center;
            font-family:'Cormorant Garamond', serif;
            color:#0f2415;
            font-size:64px;
        }

        .divider{
            width:70px;
            height:1px;
            background:#cfcfcf;
            margin:10px auto 40px;
        }

        h1{
            text-align:center;
            font-family:'Cormorant Garamond', serif;
            font-size:72px;
            font-weight:500;
            color:#222;
        }

        .subtitle{
            text-align:center;
            margin-top:10px;
            color:#666;
            font-size:18px;
            margin-bottom:40px;
        }

        .form-group{
            margin-bottom:28px;
        }

        .form-group label{
            display:block;
            margin-bottom:10px;
            font-size:16px;
            color:#555;
        }

        .password-box{
            position:relative;
        }

        .password-box input{
            width:100%;
            padding:16px;
            border:1px solid #cfcfc9;
            font-size:18px;
            outline:none;
        }

        .eye{
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#666;
            font-size:20px;
        }

        .btn-submit{
            width:100%;
            margin-top:25px;
            padding:18px;
            border:none;
            background:#002400;
            color:white;
            font-size:24px;
            font-weight:600;
            letter-spacing:1px;
            cursor:pointer;
            transition:.3s;
        }

        .btn-submit:hover{
            background:#0d3b18;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:28px;
            color:#444;
            text-decoration:none;
            font-size:18px;
        }

        .leaf{
            text-align:center;
            margin-top:50px;
            font-size:42px;
            color:#d5d5d5;
        }

        .alert-error{
            background:#fdecec;
            color:#c62828;
            padding:12px;
            margin-bottom:20px;
            border-radius:8px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="side-image">
    <img src="/images/bonsai-gray.png" alt="">
</div>

<div class="card">

    <div class="logo">ZenBonsai</div>
    <div class="divider"></div>

    <h1>Đặt lại mật khẩu</h1>

    <p class="subtitle">
        Vui lòng nhập mật khẩu mới của bạn bên dưới.
    </p>

    <div th:if="${error}"
         th:text="${error}"
         class="alert-error"></div>

    <form method="post" th:action="@{/reset-password}">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <input type="hidden"
               name="email"
               th:value="${email}"/>

        <div class="form-group">
            <label>🔒 Mật khẩu mới</label>

            <div class="password-box">
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       required>

                <span class="eye"
                      onclick="togglePassword('newPassword')">
                    👁
                </span>
            </div>
        </div>

        <div class="form-group">
            <label>🔁 Xác nhận mật khẩu mới</label>

            <div class="password-box">
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       required>

                <span class="eye"
                      onclick="togglePassword('confirmPassword')">
                    👁
                </span>
            </div>
        </div>

        <button class="btn-submit" type="submit">
            CẬP NHẬT MẬT KHẨU
        </button>
    </form>

    <a th:href="@{/login}" class="back">
        ← Quay lại đăng nhập
    </a>

    <div class="leaf">🍃</div>
</div>

<script>
    function togglePassword(id) {
        let input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
        } else {
            input.type = "password";
        }
    }
</script>

</body>
</html>

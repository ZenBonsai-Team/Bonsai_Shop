<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - ZenBonsai</title>

    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

<div class="register-page">

    <div class="register-card">

        <div class="register-header">
            <div class="leaf-icon">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h1>Tham Gia Cộng Đồng BonSai</h1>
            <p>Nơi nghệ thuật và sự kiên nhẫn hội tụ.</p>
        </div>

        <div th:if="${error}" th:text="${error}" class="alert alert-error"></div>
        <div th:if="${success}" th:text="${success}" class="alert alert-success"></div>

        <form method="post" th:action="@{/register}" class="register-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label>
                    <i class="fa-regular fa-user"></i>
                    Họ tên
                </label>
                <input type="text"
                       id="fullName"
                       name="fullName"
                       placeholder="Nhập họ và tên của bạn"
                       th:value="${formData?.fullName ?: ''}"
                       required>
                <div class="error-msg" id="fullNameError"></div>
            </div>

            <div class="form-group">
                <label>
                    <i class="fa-regular fa-address-card"></i>
                    Tên người dùng
                </label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Nhập tên người dùng"
                       th:value="${formData?.username ?: ''}"
                       required>
                <div class="error-msg" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label>
                    <i class="fa-regular fa-envelope"></i>
                    Email
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Nhập email của bạn"
                       th:value="${formData?.email ?: ''}"
                       required>
                <div class="error-msg" id="emailError"></div>
            </div>

            <div class="form-group">
                <label>
                    <i class="fa-solid fa-lock"></i>
                    Mật khẩu
                </label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Nhập mật khẩu"
                           required>

                    <span class="toggle-password" id="togglePassword">
                         <i class="fa-regular fa-eye"></i>
                     </span>
                </div>

                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group">
                <label>
                    <i class="fa-solid fa-phone"></i>
                    Số điện thoại
                    <span>(Không bắt buộc)</span>
                </label>
                <input type="text"
                       id="phone"
                       name="phone"
                       placeholder="Nhập số điện thoại"
                       th:value="${formData?.phone ?: ''}">
                <div class="error-msg" id="phoneError"></div>
            </div>

            <p class="terms">
                Bằng cách đăng ký, bạn đồng ý với
                <a href="#">Điều khoản dịch vụ</a>
                và
                <a href="#">Chính sách bảo mật</a>
                của ZenBonsai.
            </p>

            <button type="submit" class="btn-register">
                Đăng ký ngay
            </button>
        </form>

        <div class="login-link">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập ngay</a>
        </div>

    </div>

    <div class="bottom-tools">
        <span><i class="fa-solid fa-globe"></i> VI / EN</span>
        <span>Hỗ trợ</span>
    </div>

</div>

<script th:src="@{/js/register.js}"></script>
</body>
</html>

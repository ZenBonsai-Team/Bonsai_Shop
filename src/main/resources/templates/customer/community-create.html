<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết bài chia sẻ - Cộng đồng Bonsai</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Style System -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/community.css}">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<header class="community-header py-4">
    <div class="container">
        <a th:href="@{/community}" class="btn btn-outline-dark btn-sm rounded-pill px-3 mb-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Cộng đồng
        </a>
        <h1 class="community-title" style="font-size: 2.2rem; margin-bottom: 0;">Soạn thảo bài viết mới</h1>
    </div>
</header>

<!-- Form Container -->
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <form th:action="@{/community/create}" th:object="${post}" method="post" class="create-post-form">
                <!-- Title input -->
                <div class="mb-4">
                    <label for="title" class="form-label form-label-custom">Tiêu đề bài viết</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control form-control-custom" required placeholder="Nhập tiêu đề ấn tượng và rõ nghĩa...">
                </div>
                
                <div class="row">
                    <!-- Category dropdown -->
                    <div class="col-md-6 mb-4">
                        <label for="category" class="form-label form-label-custom">Danh mục bài viết</label>
                        <select id="category" th:field="*{category}" class="form-select form-control-custom" required>
                            <option value="Kỹ thuật">Kỹ thuật (Tạo dáng, bấm đọt...)</option>
                            <option value="Nghệ thuật" selected>Nghệ thuật (Triết lý, dáng cây...)</option>
                            <option value="Chăm sóc">Chăm sóc (Phân bón, tưới nước...)</option>
                            <option value="Câu chuyện">Câu chuyện (Ký sự tầm phôi, hành trình...)</option>
                            <option value="Sự kiện">Sự kiện (Triển lãm, hội chợ...)</option>
                        </select>
                    </div>
                    
                    <!-- Read time estimate -->
                    <div class="col-md-6 mb-4">
                        <label for="readTime" class="form-label form-label-custom">Thời gian đọc ước tính (phút)</label>
                        <input type="number" id="readTime" th:field="*{readTime}" class="form-control form-control-custom" required min="1" max="60" value="5">
                    </div>
                </div>
                
                <!-- Cover Image URL -->
                <div class="mb-4">
                    <label for="imageUrl" class="form-label form-label-custom">Đường dẫn ảnh bìa bài viết (URL)</label>
                    <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control form-control-custom" placeholder="Dán link ảnh từ Unsplash, Imgur... (Để trống để tự động dùng ảnh Bonsai mặc định)">
                </div>
                
                <!-- Summary description -->
                <div class="mb-4">
                    <label for="summary" class="form-label form-label-custom">Mô tả tóm tắt ngắn</label>
                    <input type="text" id="summary" th:field="*{summary}" class="form-control form-control-custom" required placeholder="Một đoạn tóm tắt ngắn khoảng 2-3 câu thu hút người đọc...">
                </div>
                
                <!-- Detailed content markdown -->
                <div class="mb-4">
                    <label for="content" class="form-label form-label-custom">Nội dung chi tiết</label>
                    <textarea id="content" th:field="*{content}" class="form-control form-control-custom" rows="12" required placeholder="Viết chia sẻ chi tiết của bạn tại đây..."></textarea>
                </div>
                
                <!-- Form actions -->
                <div class="d-flex justify-content-end gap-3 mt-5">
                    <a th:href="@{/community}" class="btn btn-outline-dark px-4 py-2" style="font-size: 0.85rem;">Hủy bỏ</a>
                    <button type="submit" class="btn btn-success px-4 py-2" style="font-size: 0.85rem; font-weight:600;">Đăng bài chia sẻ</button>
                </div>
            </form>
            
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

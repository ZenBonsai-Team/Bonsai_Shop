<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa hồ sơ - Bonsai Shop</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="profile-layout">

    <!-- SIDEBAR (Synchronized with profile.html) -->
    <aside class="sidebar">
        <a th:href="@{/home}" class="sidebar-logo d-flex align-items-center gap-2 text-decoration-none">
            <img th:src="@{/images/logo.png}" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
            <span style="font-size: 22px; font-weight: 700; color: #06210f; white-space: nowrap; font-family: 'Plus Jakarta Sans', sans-serif;">Bonsai Shop</span>
        </a>

        <nav class="sidebar-menu">
            <!-- Nút quay lại dashboard cho các vai trò đặc biệt -->
            <a sec:authorize="hasRole('OWNER')" th:href="@{/admin}" style="color: #2e7d32; font-weight: bold; background: #e8f5e9;">
                <i class="fa-solid fa-gauge"></i>
                Bảng điều khiển Chủ
            </a>
            <a sec:authorize="hasRole('CONTENT_MODERATOR')" th:href="@{/moderator/community}" style="color: #2e7d32; font-weight: bold; background: #e8f5e9;">
                <i class="fa-solid fa-gauge"></i>
                Bảng điều khiển
            </a>
            <a sec:authorize="hasRole('MODERATOR')" th:href="@{/moderator/orders}" style="color: #2e7d32; font-weight: bold; background: #e8f5e9;">
                <i class="fa-solid fa-gauge"></i>
                Bảng điều khiển
            </a>
            <a sec:authorize="hasRole('ARTISAN')" th:href="@{/seller}" style="color: #2e7d32; font-weight: bold; background: #e8f5e9;">
                <i class="fa-solid fa-store"></i>
                Kênh Nghệ nhân / Người bán
            </a>

            <a class="active" th:href="@{/profile}">
                <i class="fa-regular fa-user"></i>
                Hồ sơ
            </a>

            <a th:href="@{/orders}">
                <i class="fa-solid fa-bag-shopping"></i>
                Đơn hàng
            </a>

            <a th:href="@{/messages}">
                <i class="fa-regular fa-message"></i>
                Tin nhắn
            </a>

            <a th:href="@{/profile/change-password}">
                <i class="fa-solid fa-lock"></i>
                Đổi mật khẩu
            </a>

            <a th:href="@{/settings}">
                <i class="fa-solid fa-gear"></i>
                Cài đặt
            </a>
        </nav>

        <form method="post" th:action="@{/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Đăng xuất
            </button>
        </form>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="profile-main">

        <section class="profile-card">

            <div class="avatar-wrapper">
                <div class="avatar">
                    <img th:if="${user.avatar != null}" th:src="${user.avatar}" alt="avatar">
                    <span th:unless="${user.avatar != null}"
                          th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                </div>

                <form method="post"
                      th:action="@{/profile/update}"
                      enctype="multipart/form-data"
                      id="avatarForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="file"
                           name="avatarFile"
                           id="avatarInput"
                           accept="image/*"
                           hidden
                           onchange="document.getElementById('avatarForm').submit()">
                    <label for="avatarInput" class="avatar-edit">
                        <i class="fa-solid fa-pen"></i>
                    </label>
                </form>
            </div>

            <h1>Chỉnh sửa thông tin</h1>
            <p class="subtitle">Cập nhật thông tin định danh của bạn</p>

            <div th:if="${success}" th:text="${success}" class="alert alert-success rounded"></div>
            <div th:if="${error}" th:text="${error}" class="alert alert-error rounded"></div>

            <form method="post" th:action="@{/profile/update}" class="profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" name="fullName" th:value="${user.fullName}" required>
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" th:value="${user.username}" placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Email (Không thể thay đổi)</label>
                    <input type="email" th:value="${user.email}" disabled>
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" name="phone" th:value="${user.phone}" placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" name="address" th:value="${user.address}" placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Ngày tham gia</label>
                    <input type="text" th:value="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}" disabled>
                </div>

                <button type="submit" class="btn-submit w-100">
                    <i class="fa-regular fa-floppy-disk me-2"></i>Lưu thay đổi
                </button>

                <a th:href="@{/profile}" class="btn btn-link text-muted w-100 mt-3 text-center text-decoration-none" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem;">
                    Hủy, quay lại xem hồ sơ
                </a>
            </form>

        </section>

    </main>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa hồ sơ - Minh Kỷ Garden</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="profile-layout">

    <!-- SIDEBAR (Synchronized with profile.html) -->
    <aside class="sidebar">
        <!-- Collapsible Toggle Button -->
        <button type="button" id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Thu gọn / Mở rộng">
            <i class="fa-solid fa-angle-left"></i>
        </button>

        <a th:href="@{/home}" class="sidebar-logo d-flex align-items-center gap-3 text-decoration-none" style="padding-top: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); margin-bottom: 20px;">
            <img th:src="@{/images/logo.png}" alt="Logo" style="width: 48px; height: 48px; object-fit: contain; min-width: 48px;">
            <span class="logo-text d-flex flex-column text-start" style="font-size: 20px; font-weight: 700; color: #1C3322; font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.2;">
                <span>Minh Kỷ</span>
                <span style="color: #B8926A;">Garden</span>
            </span>
        </a>

        <nav class="sidebar-menu">
            <!-- Nút quay lại dashboard cho các vai trò đặc biệt -->
            <a sec:authorize="hasRole('OWNER')" th:href="@{/owner}" style="color: #1C3322; font-weight: bold; background: rgba(28, 51, 34, 0.05);">
                <i class="fa-solid fa-gauge"></i>
                <span>Bảng điều khiển Chủ</span>
            </a>
            <a sec:authorize="hasRole('CONTENT_MODERATOR')" th:href="@{/moderator/community}" style="color: #1C3322; font-weight: bold; background: rgba(28, 51, 34, 0.05);">
                <i class="fa-solid fa-gauge"></i>
                <span>Bảng điều khiển</span>
            </a>
            <a sec:authorize="hasRole('MODERATOR')" th:href="@{/moderator/orders}" style="color: #1C3322; font-weight: bold; background: rgba(28, 51, 34, 0.05);">
                <i class="fa-solid fa-gauge"></i>
                <span>Bảng điều khiển</span>
            </a>
            <a sec:authorize="hasRole('ARTISAN')" th:href="@{/artisan}" style="color: #1C3322; font-weight: bold; background: rgba(28, 51, 34, 0.05);">
                <i class="fa-solid fa-store"></i>
                <span>Kênh Nghệ nhân / Người bán</span>
            </a>

            <a class="active" th:href="@{/profile}">
                <i class="fa-regular fa-user"></i>
                <span>Hồ sơ</span>
            </a>

            <a th:href="@{/profile#myBonsaiJourneysSection}">
                <i class="fa-solid fa-seedling text-success"></i>
                <span>Nhật ký Bonsai</span>
            </a>

            <a th:href="@{/profile#savedPostsSection}">
                <i class="fa-regular fa-bookmark text-primary"></i>
                <span>Bài viết đã lưu</span>
            </a>

            <a th:href="@{/orders}">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Đơn hàng</span>
            </a>

            <a th:href="@{/messages}">
                <i class="fa-regular fa-message"></i>
                <span>Tin nhắn</span>
            </a>

            <a th:href="@{/profile/change-password}">
                <i class="fa-solid fa-lock"></i>
                <span>Đổi mật khẩu</span>
            </a>

            <a th:href="@{/settings}">
                <i class="fa-solid fa-gear"></i>
                <span>Cài đặt</span>
            </a>
        </nav>

        <form method="post" th:action="@{/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Đăng xuất</span>
            </button>
        </form>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="profile-main">

        <section class="profile-card">

            <div class="avatar-wrapper">
                <div class="avatar">
                    <img th:if="${user.avatar != null}" th:src="${user.avatar}" alt="avatar">
                    <span th:unless="${user.avatar != null}"
                          th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                </div>

                <form method="post"
                      th:action="@{/profile/update}"
                      enctype="multipart/form-data"
                      id="avatarForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="file"
                           name="avatarFile"
                           id="avatarInput"
                           accept="image/*"
                           hidden
                           onchange="document.getElementById('avatarForm').submit()">
                    <label for="avatarInput" class="avatar-edit">
                        <i class="fa-solid fa-pen"></i>
                    </label>
                </form>
            </div>

            <h1>Chỉnh sửa thông tin</h1>
            <p class="subtitle">Cập nhật thông tin định danh của bạn</p>

            <div th:if="${success}" th:text="${success}" class="alert alert-success rounded"></div>
            <div th:if="${error}" th:text="${error}" class="alert alert-error rounded"></div>

            <form method="post" th:action="@{/profile/update}" class="profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" name="fullName" th:value="${fullNameInput != null ? fullNameInput : user.fullName}" required>
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" th:value="${usernameInput != null ? usernameInput : user.username}" placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Email (Không thể thay đổi)</label>
                    <input type="email" th:value="${user.email}" disabled>
                </div>

                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text"
                           name="phone"
                           id="phoneInput"
                           maxlength="11"
                           inputmode="numeric"
                           th:value="${phoneInput != null ? phoneInput : user.phone}"
                           placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" name="address" th:value="${addressInput != null ? addressInput : user.address}" placeholder="Chưa cập nhật">
                </div>

                <div class="form-group">
                    <label>Ngày tham gia</label>
                    <input type="text" th:value="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}" disabled>
                </div>

                <button type="submit" class="btn-submit w-100">
                    <i class="fa-regular fa-floppy-disk me-2"></i>Lưu thay đổi
                </button>

                <a th:href="@{/profile}" class="btn btn-link text-muted w-100 mt-3 text-center text-decoration-none" style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.9rem;">
                    Hủy, quay lại xem hồ sơ
                </a>
            </form>

        </section>

    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const layout = document.querySelector('.profile-layout');
        const toggleBtn = document.getElementById('sidebarToggleBtn');
        
        if (localStorage.getItem('profile-sidebar-collapsed') === 'true') {
            layout.classList.add('collapsed');
            if (toggleBtn) {
                toggleBtn.innerHTML = '<i class="fa-solid fa-angle-right"></i>';
            }
        }
        
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                layout.classList.toggle('collapsed');
                const isCollapsed = layout.classList.contains('collapsed');
                localStorage.setItem('profile-sidebar-collapsed', isCollapsed ? 'true' : 'false');
                toggleBtn.innerHTML = isCollapsed ? 
                    '<i class="fa-solid fa-angle-right"></i>' : 
                    '<i class="fa-solid fa-angle-left"></i>';
            });
        }

        const phoneInput = document.getElementById('phoneInput');
        if (phoneInput) {
            phoneInput.addEventListener('beforeinput', function(event) {
                if (!event.data) {
                    return;
                }

                const selectedLength = phoneInput.selectionEnd - phoneInput.selectionStart;
                const nextLength = phoneInput.value.length - selectedLength + event.data.length;
                if (nextLength > 11) {
                    event.preventDefault();
                    alert('Số điện thoại chỉ được nhập tối đa 11 số!');
                }
            });

            phoneInput.addEventListener('paste', function(event) {
                const pasteText = (event.clipboardData || window.clipboardData).getData('text');
                const selectedLength = phoneInput.selectionEnd - phoneInput.selectionStart;
                const nextLength = phoneInput.value.length - selectedLength + pasteText.length;
                if (nextLength > 11) {
                    event.preventDefault();
                    alert('Số điện thoại chỉ được nhập tối đa 11 số!');
                }
            });
        }
    });
</script>

</body>
</html>

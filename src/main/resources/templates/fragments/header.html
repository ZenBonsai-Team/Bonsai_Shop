<!-- 
  Reusable Header Component
  Under: src/main/resources/templates/fragments/header.html
-->
<header th:fragment="header" class="dashboard-header" xmlns:th="http://www.thymeleaf.org">
    <!-- Left Hand Side: Sidebar trigger (mobile) & Breadcrumbs -->
    <div class="header-left">
        <button class="sidebar-toggle-btn" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
        
        <!-- Breadcrumb Component -->
        <div th:replace="~{fragments/breadcrumb :: breadcrumb}"></div>
    </div>

    <!-- Right Hand Side: Notifications & User Profile -->
    <div class="header-right">
        <!-- Notification Center -->
        <div class="dropdown me-2">
            <button class="btn btn-link p-0 text-secondary position-relative border-0 text-decoration-none shadow-none" 
                    type="button" id="bellNotificationBtn" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 1.2rem;">
                <i class="fa-solid fa-bell"></i>
                <span id="bellBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.65rem; padding: 2px 5px;">0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end shadow-lg p-0 border-0 mt-2" aria-labelledby="bellNotificationBtn" style="width: 330px; max-height: 420px; overflow-y: auto; z-index: 1100 !important; border-radius: 12px; background: #ffffff;">
                <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light" style="border-top-left-radius: 12px; border-top-right-radius: 12px;">
                    <strong class="text-dark" style="font-size: 0.9rem;">Thông báo hệ thống</strong>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-link p-0 text-decoration-none small text-success" onclick="markAllNotificationsRead()" style="font-size: 0.78rem;">Đã đọc</button>
                        <span class="text-muted small">|</span>
                        <button type="button" class="btn btn-link p-0 text-decoration-none small text-danger" onclick="clearReadNotifications()" style="font-size: 0.78rem;">Xóa đã đọc</button>
                    </div>
                </div>
                <div id="bellNotificationList" class="list-group list-group-flush">
                    <div class="text-center py-4 text-muted small">Đang tải thông báo...</div>
                </div>
            </div>
        </div>

        <script>
            function loadNotifications() {
                fetch('/api/notifications')
                    .then(res => res.json())
                    .then(data => {
                        const badge = document.getElementById('bellBadge');
                        const list = document.getElementById('bellNotificationList');
                        if (!badge || !list) return;

                        if (data.unreadCount > 0) {
                            badge.innerText = data.unreadCount;
                            badge.classList.remove('d-none');
                        } else {
                            badge.classList.add('d-none');
                        }

                        if (!data.notifications || data.notifications.length === 0) {
                            list.innerHTML = '<div class="text-center py-4 text-muted small"><i class="fa-regular fa-bell-slash me-1"></i> Chưa có thông báo mới.</div>';
                            return;
                        }

                        let html = '';
                        data.notifications.forEach(item => {
                            const bgClass = item.isRead ? 'bg-white' : 'bg-light font-weight-bold';
                            const icon = item.isRead ? 'fa-regular fa-envelope-open text-secondary' : 'fa-solid fa-bell text-warning';
                            const safeMessage = item.message.replace(/'/g, "\\'");
                            const deleteBtn = item.isRead ? `<button class="btn btn-sm text-danger p-0 border-0 ms-1" onclick="deleteNotificationItem(${item.notificationId}, event)" title="Xóa thông báo này"><i class="fa-solid fa-trash-can" style="font-size:0.8rem;"></i></button>` : '';
                            html += `
                                <div class="list-group-item list-group-item-action ${bgClass} p-3 border-bottom d-flex justify-content-between align-items-start gap-2" 
                                     style="font-size: 0.85rem; cursor: pointer;"
                                     onclick="handleNotificationClick(${item.notificationId}, '${safeMessage}')">
                                    <div class="d-flex gap-2 align-items-start flex-grow-1">
                                        <i class="${icon} mt-1"></i>
                                        <div>
                                            <p class="mb-1 text-dark" style="line-height: 1.4;">${item.message}</p>
                                            <span class="text-muted" style="font-size: 0.75rem;">${item.createdAt ? new Date(item.createdAt).toLocaleString('vi-VN') : ''}</span>
                                        </div>
                                    </div>
                                    ${deleteBtn}
                                </div>
                            `;
                        });
                        list.innerHTML = html;
                    }).catch(err => console.error(err));
            }

            function handleNotificationClick(notificationId, message) {
                fetch('/api/notifications/' + notificationId + '/read', { method: 'POST' })
                    .then(res => res.json())
                    .then(() => {
                        loadNotifications();
                        // Smart redirect if message contains post reference
                        const match = message.match(/#(\d+)/);
                        if (match && match[1]) {
                            window.location.href = '/community/post/' + match[1];
                        } else if (message.includes("kiểm duyệt") || message.includes("hàng chờ")) {
                            window.location.href = '/moderator/community?tab=comments&status=FLAGGED';
                        }
                    }).catch(() => {
                        loadNotifications();
                    });
            }

            function deleteNotificationItem(id, event) {
                if (event) event.stopPropagation();
                fetch('/api/notifications/' + id, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => loadNotifications());
            }

            function clearReadNotifications() {
                fetch('/api/notifications/clear-read', { method: 'POST' })
                    .then(res => res.json())
                    .then(() => loadNotifications());
            }

            function markAllNotificationsRead() {
                fetch('/api/notifications/mark-read', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            loadNotifications();
                        }
                    }).catch(err => console.error(err));
            }

            document.addEventListener('DOMContentLoaded', function() {
                loadNotifications();
            });
        </script>

        <!-- User Info Panel -->
        <!-- Fallbacks to placeholder details if not authenticated in Thymeleaf Spring Security -->
        <a th:href="@{/profile}" class="header-user-profile text-decoration-none text-dark" title="Thông tin cá nhân">
            <img class="user-profile-avatar" 
                 th:src="${#authentication.principal != null and #authentication.principal.avatar != null and !#authentication.principal.avatar.trim().isEmpty() ? #authentication.principal.avatar : ('https://ui-avatars.com/api/?name=' + (#authentication.principal != null and #authentication.principal.fullName != null ? #authentication.principal.fullName : #authentication.name) + '&background=06210f&color=fff')}"
                 alt="Ảnh đại diện người dùng"
                 referrerpolicy="no-referrer"
                 onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=User&background=06210f&color=fff';"
                 style="object-fit: cover; width: 36px; height: 36px; border-radius: 50%;">
            
            <div class="user-profile-info">
                <span class="user-profile-name" 
                      th:text="${#authentication.principal != null and #authentication.principal.fullName != null ? #authentication.principal.fullName : (#authentication != null and #authentication.name != null ? #authentication.name : 'Người dùng')}">
                    User Name
                </span>
                
                <span class="user-profile-role" sec:authorize="hasRole('OWNER')">Chủ cửa hàng</span>
                <span class="user-profile-role" sec:authorize="hasRole('ARTISAN')">Nghệ nhân</span>
                <span class="user-profile-role" sec:authorize="hasRole('CONTENT_MODERATOR')">Kiểm duyệt nội dung</span>
                <span class="user-profile-role" sec:authorize="hasRole('MODERATOR')">Kiểm duyệt đơn</span>
                <span class="user-profile-role" sec:authorize="hasRole('CUSTOMER')">Khách hàng</span>
            </div>
        </a>
    </div>
</header>

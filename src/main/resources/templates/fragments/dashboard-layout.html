<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, styles, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:replace="${title}">Minh Kỷ Garden Portal</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../public/css/dashboard-layout.css" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
    <!-- Specific Page Styles -->
    <th:block th:replace="${styles} ?: ~{}"></th:block>

    <!-- Global Layout Overrides to prevent global selector pollution from specific pages (e.g., artisan.css button styles) -->
    <style>
        /* 1. Reset bell notification button to transparent */
        .dashboard-header #bellNotificationBtn {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            width: auto !important;
            height: auto !important;
            color: #6c757d !important;
            display: inline-block !important;
        }
        .dashboard-header #bellNotificationBtn:hover {
            color: #1e293b !important;
        }
        
        /* 2. Reset bell badge padding and positioning */
        .dashboard-header #bellBadge {
            font-size: 0.65rem !important;
            padding: 2px 5px !important;
            background-color: #dc3545 !important;
            color: #ffffff !important;
        }

        /* 3. Reset mobile sidebar toggle button */
        .dashboard-header .sidebar-toggle-btn {
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            color: #475569 !important;
            width: 36px !important;
            height: 36px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 8px !important;
            padding: 0 !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
        }
        .dashboard-header .sidebar-toggle-btn:hover {
            background: #e2e8f0 !important;
            color: #1e293b !important;
        }
        .dashboard-header .sidebar-toggle-btn.active {
            background-color: #2E7D32 !important;
            color: #ffffff !important;
            border-color: #2E7D32 !important;
        }

        /* 4. Reset sidebar logout button styling */
        .dashboard-sidebar .sidebar-logout-btn {
            background: transparent !important;
            border: 1px solid rgba(250, 248, 245, 0.15) !important;
            color: rgba(250, 248, 245, 0.6) !important;
            width: 100% !important;
            height: auto !important;
            padding: 12px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            font-size: 0.98rem !important;
            font-weight: 500 !important;
            letter-spacing: 0.05em !important;
            border-radius: 4px !important;
        }
        .dashboard-sidebar .sidebar-logout-btn:hover {
            background: rgba(255, 82, 82, 0.08) !important;
            border-color: #ff5252 !important;
            color: #ff5252 !important;
        }

        /* 5. Reset notification list-group-item actions */
        .dropdown-menu button.btn-link,
        .dropdown-menu .btn-link {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            width: auto !important;
            height: auto !important;
            border-radius: 0 !important;
            display: inline-block !important;
        }
        .dropdown-menu .text-success {
            color: #198754 !important;
        }
        .dropdown-menu .text-danger {
            color: #dc3545 !important;
        }
        .dropdown-menu .list-group-item button.text-danger {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            width: auto !important;
            height: auto !important;
            color: #dc3545 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Reusable Dynamic Sidebar -->
        <aside th:replace="~{fragments/sidebar :: sidebar(${paramActivePage})}"></aside>

        <!-- Main Workspace Area -->
        <div class="dashboard-main">
            <!-- Reusable Dynamic Header -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content Injection Point -->
            <main class="dashboard-content">
                <div th:replace="${content}">
                    <p>Mã nguồn chính của trang sẽ được tải ở đây.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Global Layout Logic (JS Toggles) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.sidebar-toggle-btn');
            const sidebar = document.querySelector('.dashboard-sidebar');
            
            // Check if collapsed state is saved in localStorage
            if (sidebar && localStorage.getItem('sidebar-collapsed') === 'true' && window.innerWidth > 992) {
                sidebar.classList.add('collapsed');
                if (toggleBtn) toggleBtn.classList.add('active');
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (window.innerWidth > 992) {
                        sidebar.classList.toggle('collapsed');
                        const isCollapsed = sidebar.classList.contains('collapsed');
                        localStorage.setItem('sidebar-collapsed', isCollapsed);
                        if (isCollapsed) {
                            toggleBtn.classList.add('active');
                        } else {
                            toggleBtn.classList.remove('active');
                        }
                    } else {
                        sidebar.classList.toggle('open');
                        const isOpen = sidebar.classList.contains('open');
                        if (isOpen) {
                            toggleBtn.classList.add('active');
                        } else {
                            toggleBtn.classList.remove('active');
                        }
                    }
                });
                
                // Close sidebar when clicking outside on mobile devices
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 992 && 
                        !sidebar.contains(e.target) && 
                        !toggleBtn.contains(e.target)) {
                        sidebar.classList.remove('open');
                        toggleBtn.classList.remove('active');
                    }
                });
            }
        });
    </script>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Specific Page Scripts -->
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>
</html>

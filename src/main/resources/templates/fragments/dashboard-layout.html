<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, styles, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Minh Kỷ Garden Portal</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../public/css/dashboard-layout.css" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
    <!-- Specific Page Styles -->
    <th:block th:replace="${styles} ?: ~{}"></th:block>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Reusable Dynamic Sidebar -->
        <aside th:replace="~{fragments/sidebar :: sidebar(${paramActivePage})}"></aside>

        <!-- Main Workspace Area -->
        <div class="dashboard-main">
            <!-- Reusable Dynamic Header -->
            <header th:replace="~{fragments/header :: header}"></header>

            <!-- Main Content Injection Point -->
            <main class="dashboard-content">
                <div th:replace="${content}">
                    <p>Mã nguồn chính của trang sẽ được tải ở đây.</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Global Layout Logic (JS Toggles) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.sidebar-toggle-btn');
            const sidebar = document.querySelector('.dashboard-sidebar');
            
            // Check if collapsed state is saved in localStorage
            if (sidebar && localStorage.getItem('sidebar-collapsed') === 'true' && window.innerWidth > 992) {
                sidebar.classList.add('collapsed');
                if (toggleBtn) toggleBtn.classList.add('active');
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (window.innerWidth > 992) {
                        sidebar.classList.toggle('collapsed');
                        const isCollapsed = sidebar.classList.contains('collapsed');
                        localStorage.setItem('sidebar-collapsed', isCollapsed);
                        if (isCollapsed) {
                            toggleBtn.classList.add('active');
                        } else {
                            toggleBtn.classList.remove('active');
                        }
                    } else {
                        sidebar.classList.toggle('open');
                        const isOpen = sidebar.classList.contains('open');
                        if (isOpen) {
                            toggleBtn.classList.add('active');
                        } else {
                            toggleBtn.classList.remove('active');
                        }
                    }
                });
                
                // Close sidebar when clicking outside on mobile devices
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 992 && 
                        !sidebar.contains(e.target) && 
                        !toggleBtn.contains(e.target)) {
                        sidebar.classList.remove('open');
                        toggleBtn.classList.remove('active');
                    }
                });
            }
        });
    </script>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Specific Page Scripts -->
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>
</html>

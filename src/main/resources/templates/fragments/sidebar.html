<!-- 
  Reusable Dynamic Sidebar Component
  Under: src/main/resources/templates/fragments/sidebar.html
-->
<aside th:fragment="sidebar(paramActivePage)" class="dashboard-sidebar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <th:block th:with="
        activePage=${paramActivePage != null ? (#strings.contains(paramActivePage, '-') ? #strings.substringAfter(paramActivePage, '-') : paramActivePage) : (activePage != null ? activePage : null)}
    ">
        <!-- Brand Header -->
        <div class="sidebar-brand">
            <a th:href="@{/home}" class="sidebar-brand-link d-flex align-items-center gap-2 text-decoration-none">
                <img th:src="@{/images/logo.png}" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
                <span class="artisan-brand-text" style="font-size: 18px; font-weight: 700; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; line-height: 1.2; letter-spacing: 0.5px;">Minh Kỷ Garden</span>
            </a>
        </div>

        <!-- Navigation List (Conditionally rendered by role/authority) -->
        <nav class="sidebar-nav">
            <!-- 1. OWNER (ADMIN) MENU -->
            <th:block sec:authorize="hasRole('OWNER')">
                <a th:href="@{/owner}"
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-gauge"></i></span>
                    <span>Bảng điều khiển</span>
                </a>
                <a th:href="@{/owner/users}"
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'users' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
                    <span>Quản lý người dùng</span>
                </a>
                <a href="#" class="sidebar-nav-item" 
                   th:classappend="${activePage == 'system-config' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
                    <span>Cấu hình hệ thống</span>
                </a>
            </th:block>

            <!-- 2. ORDER MODERATOR MENU -->
            <th:block sec:authorize="hasRole('MODERATOR')">
                <a th:href="@{/moderator/orders/pool}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'pool' or activePage == 'orders-pool' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-box"></i></span>
                    <span>Kho đơn hàng</span>
                </a>
                <a th:href="@{/moderator/orders/my}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'my' or activePage == 'my-orders' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span>
                    <span>Đơn của tôi</span>
                </a>
            </th:block>

            <!-- 3. CONTENT MODERATOR MENU -->
            <th:block sec:authorize="hasRole('CONTENT_MODERATOR')">
                <a th:href="@{/moderator/community?tab=posts}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'posts' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-file-lines"></i></span>
                    <span>Quản lý bài viết</span>
                </a>
                <a th:href="@{/moderator/community?tab=comments}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'comments' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-comments"></i></span>
                    <span>Quản lý bình luận</span>
                </a>
                <a th:href="@{/moderator/live-session}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'live-session' or activePage == 'session' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-tower-broadcast"></i></span>
                    <span>Live Stream</span>
                </a>
                <a th:href="@{/moderator/reviews}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'reviews' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-regular fa-star"></i></span>
                    <span>Quản lý đánh giá</span>
                </a>
            </th:block>

            <!-- 4. ARTISAN MENU -->
            <th:block sec:authorize="hasRole('ARTISAN')">
                <a th:href="@{/artisan}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'dashboard' or activePage == 'artisan-dashboard' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-gauge-high"></i></span>
                    <span>Bảng điều khiển</span>
                </a>
                <a th:href="@{/artisan/products}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'products' or activePage == 'artisan-products' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-seedling"></i></span>
                    <span>Sản phẩm của tôi</span>
                </a>
                <a th:href="@{/artisan/in-person-order}"
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'in-person-order' or activePage == 'artisan-in-person-order' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-cash-register"></i></span>
                    <span>Đơn tại vườn</span>
                </a>                <a th:href="@{/artisan/appointments}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'appointments' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-calendar-check"></i></span>
                    <span>Lịch hẹn</span>
                </a>
                <a th:href="@{/artisan/catalog}" 
                   class="sidebar-nav-item" 
                   th:classappend="${activePage == 'catalog' ? 'active' : ''}">
                    <span class="nav-icon"><i class="fa-solid fa-book"></i></span>
                    <span>Danh mục sản phẩm</span>
                </a>
            </th:block>
        </nav>

        <!-- Logout Action Footer -->
        <div class="sidebar-footer">
            <form method="post" th:action="@{/logout}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="sidebar-logout-btn">
                    <span class="logout-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>
    </th:block>
</aside>

<!-- 
  Reusable Breadcrumbs Navigation Component
  Under: src/main/resources/templates/fragments/breadcrumb.html
-->
<div th:fragment="breadcrumb" class="breadcrumb-container" xmlns:th="http://www.thymeleaf.org">
    <!-- Optional Crumbs list loop -->
    <th:block th:if="${crumbs != null}">
        <th:block th:each="crumb, iter : ${crumbs}">
            <a th:if="${!iter.last}" th:href="${crumb.value}" class="breadcrumb-item" th:text="${crumb.key}">Parent Link</a>
            <span th:if="${!iter.last}" class="breadcrumb-separator">/</span>
            <span th:if="${iter.last}" class="breadcrumb-item active" th:text="${crumb.key}">Active Page</span>
        </th:block>
    </th:block>

    <!-- Default trail if no crumbs are specified -->
    <th:block th:if="${crumbs == null}">
        <span class="breadcrumb-item active" 
              th:text="${activePageLabel != null ? activePageLabel : 
                       (paramActivePage == 'moderator-dashboard' or paramActivePage == 'artisan-dashboard' or paramActivePage == 'dashboard' or paramActivePage == 'admin-dashboard' ? 'Bảng điều khiển' : 
                       (paramActivePage == 'moderator-orders' or paramActivePage == 'orders' ? 'Quản lý đơn hàng' : 
                       (paramActivePage == 'moderator-users' or paramActivePage == 'users' or paramActivePage == 'admin-users' ? 'Quản lý người dùng' : 
                       (paramActivePage == 'moderator-community' or paramActivePage == 'community' ? 'Quản lý bài viết' : 
                       (paramActivePage == 'artisan-products' or paramActivePage == 'products' ? 'Sản phẩm của tôi' : 
                       (paramActivePage == 'artisan-catalog' or paramActivePage == 'catalog' ? 'Danh mục sản phẩm' : 
                       (paramActivePage == 'artisan-profile' or paramActivePage == 'profile' or paramActivePage == 'artisan-profile' ? 'Thông tin cá nhân' : 'Bảng điều khiển')))))))}">Bảng điều khiển</span>
    </th:block>
</div>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sản phẩm - Artisan</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-products')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
    <header class="page-header">
        <div>
            <h1>Bước 1: Thông tin sản phẩm</h1>
            <p>Thông tin cơ bản của cây bonsai.</p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/artisan/catalog}">Quản lý phân loại</a>
            <a class="btn secondary" th:href="@{/artisan/products}">Quay lại sản phẩm</a>
        </div>
    </header>

    <div id="artisanFlashError" th:if="${error}" th:attr="data-message=${error}" hidden></div>

    <form class="form-card" method="post" th:object="${productForm}"
          th:action="${product == null} ? @{/artisan/products} : @{/artisan/products/{id}(id=${product.productId})}">
        <label th:if="${product != null}">Mã sản phẩm
            <input readonly th:value="${product.productCode}">
        </label>
        <p th:if="${product == null}" class="form-hint">Mã sản phẩm sẽ được hệ thống tự động sinh sau khi lưu.</p>

        <label>Tên cây
            <input th:field="*{productName}" required>
            <small th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}" class="text-danger"></small>
        </label>

        <div class="grid">
            <label>Danh mục (Category)
                <select id="categorySelect" required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.categoryId}"
                            th:selected="${selectedCategoryId != null && selectedCategoryId == category.categoryId}"
                            th:text="${category.categoryName}"></option>
                </select>
            </label>

            <label>Loại cây (Variety)
                <select id="varietySelect" name="varietyId" required>
                    <option value="">-- Chọn loại cây --</option>
                    <option th:each="variety : ${varieties}"
                            th:value="${variety.varietyId}"
                            th:attr="data-category-id=${variety.category.categoryId}"
                            th:selected="${productForm.varietyId != null && productForm.varietyId == variety.varietyId}"
                            th:text="${variety.varietyName}"></option>
                </select>
                <small th:if="${#fields.hasErrors('varietyId')}" th:errors="*{varietyId}" class="text-danger"></small>
            </label>

            <label>Phân khúc (Segment)
                <select th:field="*{segmentId}" required>
                    <option value="">-- Chọn phân khúc --</option>
                    <option th:each="segment : ${segments}"
                            th:value="${segment.segmentId}"
                            th:text="${segment.segmentName}"></option>
                </select>
                <small th:if="${#fields.hasErrors('segmentId')}" th:errors="*{segmentId}" class="text-danger"></small>
            </label>
        </div>

        <fieldset class="form-group">
            <legend>Thẻ nhãn (Tags)</legend>
            <p th:if="${#lists.isEmpty(tags)}" class="form-hint">Chưa có thẻ nhãn nào trong hệ thống.</p>
            <label class="checkbox" th:each="tag : ${tags}">
                <input type="checkbox"
                       th:field="*{tagIds}"
                       th:value="${tag.tagId}">
                <span th:text="${tag.tagName}"></span>
            </label>
        </fieldset>

        <label>Mô tả
            <textarea th:field="*{description}" rows="5"></textarea>
        </label>

        <label>Câu chuyện cây
            <textarea th:field="*{treeStory}" rows="5" placeholder="Nguồn gốc, hành trình chăm sóc, ý nghĩa hoặc câu chuyện riêng của cây..."></textarea>
        </label>

        <div class="grid">
            <label>Tuổi
                <span class="input-with-unit">
                    <input type="number" th:field="*{age}" min="0" required>
                    <span>năm</span>
                </span>
                <small th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-danger"></small>
            </label>
            <label>Chiều cao
                <span class="input-with-unit">
                    <input type="number" step="0.01" th:field="*{height}" min="0" required>
                    <span>cm</span>
                </span>
                <small th:if="${#fields.hasErrors('height')}" th:errors="*{height}" class="text-danger"></small>
            </label>
            <label>Đường kính thân
                <span class="input-with-unit">
                    <input type="number" step="0.01" th:field="*{trunkDiameter}" min="0" required>
                    <span>cm</span>
                </span>
                <small th:if="${#fields.hasErrors('trunkDiameter')}" th:errors="*{trunkDiameter}" class="text-danger"></small>
            </label>
        </div>

        <label>Dáng cây (Style/Dáng)
            <input th:field="*{style}" required>
            <small th:if="${#fields.hasErrors('style')}" th:errors="*{style}" class="text-danger"></small>
        </label>

        <label>Giá
            <span class="input-with-unit">
                <input id="priceDisplay"
                       type="text"
                       inputmode="numeric"
                       required
                       th:attr="data-price=${productForm.price}">
                <input id="priceValue" type="hidden" name="price" th:value="${productForm.price}">
                <span>VNĐ</span>
            </span>
            <small th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></small>
        </label>
        <input th:if="${product != null}" type="hidden" name="productStatus" th:value="${productForm.productStatus}">
        <button type="submit">Lưu & Tiếp tục</button>
    </form>
</main>
</div>

<script>
    const categorySelect = document.getElementById('categorySelect');
    const varietySelect = document.getElementById('varietySelect');
    const varietyOptions = [...varietySelect.options].slice(1);

    function filterVarietiesByCategory(shouldResetVariety) {
        const categoryId = categorySelect.value;

        varietyOptions.forEach((option) => {
            option.hidden = categoryId && option.dataset.categoryId !== categoryId;
        });

        const selectedOption = varietySelect.selectedOptions[0];
        if (shouldResetVariety || (selectedOption && selectedOption.hidden)) {
            varietySelect.value = '';
        }

        varietySelect.disabled = !categoryId;
    }

    categorySelect.addEventListener('change', () => filterVarietiesByCategory(true));
    filterVarietiesByCategory(false);

    const priceDisplay = document.getElementById('priceDisplay');
    const priceValue = document.getElementById('priceValue');

    function normalizePrice(value) {
        const trimmedValue = value.trim();
        if (/^\d+[,.]\d{1,2}$/.test(trimmedValue)) {
            return trimmedValue.replace(/[,.]\d{1,2}$/, '');
        }
        return trimmedValue.replace(/[^\d]/g, '');
    }

    function formatVnd(value) {
        const normalizedValue = normalizePrice(value);
        return normalizedValue ? Number(normalizedValue).toLocaleString('vi-VN') : '';
    }

    function syncPriceValue() {
        const normalizedValue = normalizePrice(priceDisplay.value);
        priceValue.value = normalizedValue;
        priceDisplay.value = formatVnd(normalizedValue);
    }

    priceDisplay.value = formatVnd(priceDisplay.dataset.price || priceValue.value);
    priceValue.value = normalizePrice(priceDisplay.dataset.price || priceValue.value);
    priceDisplay.addEventListener('input', syncPriceValue);
    priceDisplay.form.addEventListener('submit', syncPriceValue);
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const successFlash = document.getElementById('artisanFlashSuccess');
        const errorFlash = document.getElementById('artisanFlashError');

        if (successFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.success(successFlash.dataset.message);
        }

        if (errorFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.error(errorFlash.dataset.message);
        }
    });
</script>
</body>
</html>

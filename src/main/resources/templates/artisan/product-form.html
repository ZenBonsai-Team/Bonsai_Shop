<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Info</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-products')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
    <header class="page-header">
        <div>
            <h1>Step 1: Product Info</h1>
            <p>Thông tin cơ bản của cây bonsai.</p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/artisan/catalog}">Manage Catalog</a>
            <a class="btn secondary" th:href="@{/artisan/products}">Back to My Products</a>
        </div>
    </header>

    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form class="form-card" method="post"
          th:action="${product == null} ? @{/artisan/products} : @{/artisan/products/{id}(id=${product.productId})}">
        <label th:if="${product != null}">Mã sản phẩm
            <input readonly th:value="${product.productCode}">
        </label>
        <p th:if="${product == null}" class="form-hint">Mã sản phẩm sẽ được hệ thống tự động sinh sau khi lưu.</p>

        <label>Tên cây
            <input name="productName" required th:value="${product != null ? product.productName : ''}">
        </label>

        <div class="grid">
            <label>Category
                <select id="categorySelect" required>
                    <option value="">-- Chọn category --</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.categoryId}"
                            th:selected="${selectedCategoryId != null && selectedCategoryId == category.categoryId}"
                            th:text="${category.categoryName}"></option>
                </select>
            </label>

            <label>Variety
                <select id="varietySelect" name="varietyId" required>
                    <option value="">-- Chọn variety --</option>
                    <option th:each="variety : ${varieties}"
                            th:value="${variety.varietyId}"
                            th:attr="data-category-id=${variety.category.categoryId}"
                            th:selected="${product != null && product.variety.varietyId == variety.varietyId}"
                            th:text="${variety.varietyName}"></option>
                </select>
            </label>

            <label>Segment
                <select name="segmentId" required>
                    <option value="">-- Chọn segment --</option>
                    <option th:each="segment : ${segments}"
                            th:value="${segment.segmentId}"
                            th:selected="${product != null && product.segment.segmentId == segment.segmentId}"
                            th:text="${segment.segmentName}"></option>
                </select>
            </label>
        </div>

        <fieldset class="form-group">
            <legend>Tags</legend>
            <p th:if="${#lists.isEmpty(tags)}" class="form-hint">Chưa có tag nào trong hệ thống.</p>
            <label class="checkbox" th:each="tag : ${tags}">
                <input type="checkbox"
                       name="tagIds"
                       th:value="${tag.tagId}"
                       th:checked="${selectedTagIds.contains(tag.tagId)}">
                <span th:text="${tag.tagName}"></span>
            </label>
        </fieldset>

        <label>Mô tả
            <textarea name="description" rows="5" th:text="${product != null ? product.description : ''}"></textarea>
        </label>

        <div class="grid">
            <label>Tuổi
                <span class="input-with-unit">
                    <input type="number" name="age" min="0" required th:value="${product != null ? product.age : ''}">
                    <span>năm</span>
                </span>
            </label>
            <label>Chiều cao
                <span class="input-with-unit">
                    <input type="number" step="0.01" name="height" min="0" required th:value="${product != null ? product.height : ''}">
                    <span>cm</span>
                </span>
            </label>
            <label>Đường kính thân
                <span class="input-with-unit">
                    <input type="number" step="0.01" name="trunkDiameter" min="0" required th:value="${product != null ? product.trunkDiameter : ''}">
                    <span>cm</span>
                </span>
            </label>
        </div>

        <label>Style
            <input name="style" required th:value="${product != null ? product.style : ''}">
        </label>

        <label>Giá
            <span class="input-with-unit">
                <input id="priceDisplay"
                       type="text"
                       inputmode="numeric"
                       required
                       th:attr="data-price=${product != null ? product.price : ''}">
                <input id="priceValue" type="hidden" name="price" th:value="${product != null ? product.price : ''}">
                <span>VNĐ</span>
            </span>
        </label>
        <input th:if="${product != null}" type="hidden" name="productStatus" th:value="${product.productStatus}">
        <button type="submit">Save & Continue</button>
    </form>
</main>
</div>

<script>
    const categorySelect = document.getElementById('categorySelect');
    const varietySelect = document.getElementById('varietySelect');
    const varietyOptions = [...varietySelect.options].slice(1);

    function filterVarietiesByCategory(shouldResetVariety) {
        const categoryId = categorySelect.value;

        varietyOptions.forEach((option) => {
            option.hidden = categoryId && option.dataset.categoryId !== categoryId;
        });

        const selectedOption = varietySelect.selectedOptions[0];
        if (shouldResetVariety || (selectedOption && selectedOption.hidden)) {
            varietySelect.value = '';
        }

        varietySelect.disabled = !categoryId;
    }

    categorySelect.addEventListener('change', () => filterVarietiesByCategory(true));
    filterVarietiesByCategory(false);

    const priceDisplay = document.getElementById('priceDisplay');
    const priceValue = document.getElementById('priceValue');

    function normalizePrice(value) {
        const trimmedValue = value.trim();
        if (/^\d+[,.]\d{1,2}$/.test(trimmedValue)) {
            return trimmedValue.replace(/[,.]\d{1,2}$/, '');
        }
        return trimmedValue.replace(/[^\d]/g, '');
    }

    function formatVnd(value) {
        const normalizedValue = normalizePrice(value);
        return normalizedValue ? Number(normalizedValue).toLocaleString('vi-VN') : '';
    }

    function syncPriceValue() {
        const normalizedValue = normalizePrice(priceDisplay.value);
        priceValue.value = normalizedValue;
        priceDisplay.value = formatVnd(normalizedValue);
    }

    priceDisplay.value = formatVnd(priceDisplay.dataset.price || priceValue.value);
    priceValue.value = normalizePrice(priceDisplay.dataset.price || priceValue.value);
    priceDisplay.addEventListener('input', syncPriceValue);
    priceDisplay.form.addEventListener('submit', syncPriceValue);
</script>
</body>
</html>

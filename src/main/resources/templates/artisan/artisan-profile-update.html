<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Hồ sơ Nghệ nhân - Bonsai Shop</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan-profile.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-profile')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>

        <div class="artisan-profile-page">
            <div class="artisan-profile-container">
                <section class="artisan-profile-card">
                    <div class="artisan-profile-heading">
                        <h1>Cập nhật Hồ sơ Nghệ nhân</h1>
                        <p>Vui lòng điền đầy đủ thông tin để lưu trữ tinh hoa và hành trình nghề nghiệp của bạn.</p>
                    </div>

                    <div th:if="${error}" class="artisan-profile-message error" th:text="${error}"></div>

                    <form method="post" th:action="@{/artisan/profile/artisan-profile/update}" th:object="${artisanProfileForm}">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="artisan-profile-field">
                            <span class="artisan-profile-icon"><i class="fa-regular fa-id-badge"></i></span>
                            <div>
                                <label class="artisan-profile-label" for="fullName">Tên nghệ nhân</label>
                                <input id="fullName" th:field="*{fullName}" required>
                                <small th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="artisan-profile-error"></small>
                            </div>
                        </div>

                        <div class="artisan-profile-field">
                            <span class="artisan-profile-icon"><i class="fa-solid fa-medal"></i></span>
                            <div>
                                <label class="artisan-profile-label" for="specialty">Chuyên môn</label>
                                <input id="specialty" th:field="*{specialty}" placeholder="Ví dụ: Sanh Nam Điền">
                                <small th:if="${#fields.hasErrors('specialty')}" th:errors="*{specialty}" class="artisan-profile-error"></small>
                            </div>
                        </div>

                        <div class="artisan-profile-field">
                            <span class="artisan-profile-icon"><i class="fa-regular fa-hourglass-half"></i></span>
                            <div>
                                <label class="artisan-profile-label" for="yearsOfExperience">Năm kinh nghiệm</label>
                                <div class="artisan-profile-inline">
                                    <input id="yearsOfExperience" th:field="*{yearsOfExperience}" type="number" min="0">
                                    <span class="artisan-profile-unit">Năm</span>
                                </div>
                                <small th:if="${#fields.hasErrors('yearsOfExperience')}" th:errors="*{yearsOfExperience}" class="artisan-profile-error"></small>
                            </div>
                        </div>

                        <div class="artisan-profile-field">
                            <span class="artisan-profile-icon"><i class="fa-regular fa-scroll"></i></span>
                            <div>
                                <label class="artisan-profile-label" for="bio">Giới thiệu nghệ nhân</label>
                                <textarea id="bio" th:field="*{bio}" placeholder="Chia sẻ kinh nghiệm, phong cách và thế mạnh của bạn"></textarea>
                                <small th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}" class="artisan-profile-error"></small>
                            </div>
                        </div>

                        <div class="artisan-profile-actions">
                            <button type="submit" class="artisan-profile-btn primary">Lưu hồ sơ nghệ nhân</button>
                            <a class="artisan-profile-btn secondary" th:href="@{/artisan/profile/artisan-profile}">Hủy bỏ</a>
                        </div>
                    </form>
                </section>
            </div>

        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

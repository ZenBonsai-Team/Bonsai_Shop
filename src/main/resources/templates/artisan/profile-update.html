<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Artisan Profile</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-profile')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <header class="page-header">
            <div>
                <h1>Edit Profile</h1>
                <p>Cập nhật thông tin tài khoản artisan.</p>
            </div>
            <a class="btn secondary" th:href="@{/artisan/profile}">Back to My Profile</a>
        </header>

        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <section class="artisan-profile-card">
            <form class="artisan-profile-form" method="post" th:action="@{/artisan/profile/update}" enctype="multipart/form-data">
                <div class="artisan-profile-header">
                    <div class="artisan-profile-avatar">
                        <img th:if="${artisan.avatar != null}" th:src="${artisan.avatar}" alt="avatar">
                        <span th:if="${artisan.avatar == null}" th:text="${#strings.substring(artisan.fullName, 0, 1)}">S</span>
                    </div>
                    <div>
                        <h2 th:text="${artisan.fullName}">Artisan Name</h2>
                        <p th:text="${artisan.email}">artisan@example.com</p>
                        <label class="avatar-upload">
                            Avatar
                            <input type="file" name="avatarFile" accept="image/*">
                        </label>
                    </div>
                </div>

                <div class="artisan-profile-fields">
                    <label class="profile-row">
                        <span>👤</span>
                        <div>
                            <small>Họ và tên</small>
                            <input name="fullName" required th:value="${artisan.fullName}">
                        </div>
                    </label>
                    <label class="profile-row">
                        <span>🆔</span>
                        <div>
                            <small>Tên đăng nhập</small>
                            <input name="username" th:value="${artisan.username}" placeholder="Chưa cập nhật">
                        </div>
                    </label>
                    <label class="profile-row">
                        <span>📧</span>
                        <div>
                            <small>Email không thể thay đổi</small>
                            <input th:value="${artisan.email}" disabled>
                        </div>
                    </label>
                    <label class="profile-row">
                        <span>📱</span>
                        <div>
                            <small>Số điện thoại</small>
                            <input name="phone" th:value="${artisan.phone}" placeholder="Chưa cập nhật">
                        </div>
                    </label>
                    <label class="profile-row">
                        <span>🏠</span>
                        <div>
                            <small>Địa chỉ</small>
                            <input name="address" th:value="${artisan.address}" placeholder="Chưa cập nhật">
                        </div>
                    </label>
                </div>

                <div class="actions artisan-profile-actions">
                    <button type="submit">Save Changes</button>
                    <a class="btn secondary" th:href="@{/artisan/profile}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>

</body>
</html>

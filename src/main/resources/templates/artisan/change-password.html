<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Artisan</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-profile')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <header class="page-header">
            <div>
                <h1>Đổi mật khẩu</h1>
                <p>Cập nhật mật khẩu tài khoản nghệ nhân.</p>
            </div>
            <a class="btn secondary" th:href="@{/artisan/profile}">Quay lại Hồ sơ</a>
        </header>

        <div id="artisanFlashSuccess" th:if="${success}" th:attr="data-message=${success}" hidden></div>
        <div id="artisanFlashError" th:if="${error}" th:attr="data-message=${error}" hidden></div>

        <section class="artisan-profile-card">
            <form class="artisan-profile-fields" method="post" th:action="@{/artisan/profile/change-password}">
                <label class="profile-row">
                    <span>🔑</span>
                    <div>
                        <small>Mật khẩu hiện tại</small>
                        <input type="password" name="currentPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>🆕</span>
                    <div>
                        <small>Mật khẩu mới</small>
                        <input type="password" name="newPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>✅</span>
                    <div>
                        <small>Xác nhận mật khẩu mới</small>
                        <input type="password" name="confirmPassword" required>
                    </div>
                </label>

                <div class="actions">
                    <button type="submit">Lưu mật khẩu mới</button>
                    <a class="btn secondary" th:href="@{/artisan/profile}">Hủy</a>
                </div>
            </form>
        </section>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const successFlash = document.getElementById('artisanFlashSuccess');
        const errorFlash = document.getElementById('artisanFlashError');

        if (successFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.success(successFlash.dataset.message);
        }

        if (errorFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.error(errorFlash.dataset.message);
        }
    });
</script>
</body>
</html>

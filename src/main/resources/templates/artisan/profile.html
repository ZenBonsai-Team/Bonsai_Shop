<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Artisan</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-profile')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>

        <div class="p-4">
            <header class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="serif-text mb-1">Thông tin cá nhân</h1>
                    <p class="text-secondary mb-0">Quản lý và cập nhật thông tin nhà vườn của bạn.</p>
                </div>
                <a class="btn btn-outline-secondary" th:href="@{/artisan}">Quay lại Bảng điều khiển</a>
            </header>

            <!-- Alert messages -->
            <div id="artisanFlashSuccess" th:if="${success}" th:attr="data-message=${success}" hidden></div>
            <div id="artisanFlashError" th:if="${error}" th:attr="data-message=${error}" hidden></div>

            <!-- Profile Info Block (Styled exactly like customer/profile.html) -->
            <section class="profile-top rounded border-0 shadow-sm p-4 bg-white mb-4" style="border-radius: 16px;">
                <div class="avatar-box">
                    <img th:if="${artisan.avatar != null}" th:src="${artisan.avatar}" alt="avatar">
                    <span th:unless="${artisan.avatar != null}"
                          th:text="${#strings.substring(artisan.fullName, 0, 1)}">
                        S
                    </span>
                </div>

                <div class="user-info-grid flex-grow-1">
                    <div class="user-info-item">
                        <i class="fa-regular fa-user"></i>
                        <div>
                            <span>Họ và tên</span>
                            <strong th:text="${artisan.fullName}">Bonsai Garden</strong>
                        </div>
                    </div>

                    <div class="user-info-item">
                        <i class="fa-regular fa-envelope"></i>
                        <div>
                            <span>Email</span>
                            <strong th:text="${artisan.email}">artisan@example.com</strong>
                        </div>
                    </div>

                    <div class="user-info-item">
                        <i class="fa-solid fa-phone"></i>
                        <div>
                            <span>Số điện thoại</span>
                            <strong th:text="${artisan.phone != null ? artisan.phone : 'Chưa cập nhật'}">Chưa cập nhật</strong>
                        </div>
                    </div>

                    <div class="user-info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <span>Địa chỉ</span>
                            <strong th:text="${artisan.address != null ? artisan.address : 'Chưa cập nhật'}">Chưa cập nhật</strong>
                        </div>
                    </div>

                    <div class="user-info-item">
                        <i class="fa-regular fa-calendar"></i>
                        <div>
                            <span>Ngày tham gia</span>
                            <strong th:text="${#temporals.format(artisan.createdAt, 'dd/MM/yyyy')}">01/01/2025</strong>
                        </div>
                    </div>

                    <div class="user-info-item">
                        <i class="fa-solid fa-circle-check"></i>
                        <div>
                            <span>Trạng thái</span>
                            <strong th:text="${artisan.status == 'ACTIVE' ? 'Đang hoạt động' : (artisan.status == 'INACTIVE' ? 'Tạm khóa' : artisan.status)}">Đang hoạt động</strong>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column gap-2 ms-auto" style="min-width: 180px;">
                    <a th:href="@{/artisan/profile/update}" class="edit-btn text-decoration-none rounded text-center">
                        Chỉnh sửa hồ sơ
                    </a>
                    <a th:href="@{/artisan/profile/change-password}" class="edit-btn text-decoration-none rounded text-center text-secondary border-secondary bg-transparent">
                        Đổi mật khẩu
                    </a>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const successFlash = document.getElementById('artisanFlashSuccess');
        const errorFlash = document.getElementById('artisanFlashError');

        if (successFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.success(successFlash.dataset.message);
        }

        if (errorFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.error(errorFlash.dataset.message);
        }
    });
</script>
</body>
</html>

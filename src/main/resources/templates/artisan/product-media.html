<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải lên hình ảnh & video - Artisan</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/artisan.css}">
    <link rel="stylesheet" th:href="@{/css/bsms-notification.css}">
    <script th:src="@{/js/bsms-notification.js}"></script>
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('artisan-products')}"></div>

    <main class="dashboard-main">
        <div th:replace="~{fragments/artisan-topbar :: topbar('Tải lên hình ảnh/video')}"></div>
    <header class="page-header">
        <div>
            <h1>Bước 2: Tải lên hình ảnh & video</h1>
            <p th:text="${product.productName}">Product</p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/artisan/products/{id}/edit(id=${product.productId})}">Sửa thông tin</a>
            <a class="btn secondary" th:href="@{/artisan/products}">Danh sách sản phẩm</a>
            <a class="btn" th:href="@{/artisan/products/{id}/preview(id=${product.productId})}">Tiếp tục xem preview</a>
        </div>
    </header>

    <div id="artisanFlashSuccess" th:if="${success}" th:attr="data-message=${success}" hidden></div>
    <div id="artisanFlashError" th:if="${error}" th:attr="data-message=${error}" hidden></div>
    <div th:if="${!isEditable}" class="alert warning">Chỉ có thể sửa media của sản phẩm nháp hoặc đã ẩn.</div>

    <form th:if="${isEditable}" class="form-card" method="post" enctype="multipart/form-data"
          th:action="@{/artisan/products/{id}/media(id=${product.productId})}">
        <label>File ảnh/video
            <input id="mediaFileInput" type="file" name="file" accept="image/*,video/mp4,video/webm" required>
        </label>
        <label>Góc chụp (Shot type)
            <select id="shotTypeSelect" name="slotType">
                <option value="">-- Chọn góc chụp --</option>
                <option value="FRONT">FRONT - Chính diện</option>
                <option value="BACK">BACK - Mặt sau</option>
                <option value="LEFT">LEFT - Bên trái</option>
                <option value="RIGHT">RIGHT - Bên phải</option>
                <option value="DETAIL">DETAIL - Cận cảnh chi tiết</option>
                <option value="TRUNK">TRUNK - Cận cảnh thân cây</option>
                <option value="BRANCH">BRANCH - Cận cảnh cành</option>
                <option value="POT">POT - Mặt bệ</option>
                <option value="OVERVIEW">OVERVIEW - Tổng quan</option>
            </select>
        </label>
        <label>Chú thích (Caption)
            <input name="caption">
        </label>
        <p class="form-hint">Sau khi tải lên, bạn có thể kiểm tra ảnh, đặt thumbnail, chỉnh thứ tự và caption trước khi sang preview.</p>
        <label class="checkbox">
            <input type="checkbox" name="isThumbnail" value="true">
            Đặt làm thumbnail
        </label>
        <button type="submit">Tải lên file</button>
    </form>

    <form id="mediaOrderForm" method="post" th:action="@{/artisan/products/{id}/media/order(id=${product.productId})}"></form>
    <div class="actions media-toolbar" th:if="${isEditable && !#lists.isEmpty(mediaList)}">
        <button type="submit" form="mediaOrderForm">Lưu thứ tự & caption</button>
    </div>

    <section class="media-grid">
        <article class="media-card" th:each="media : ${mediaList}">
            <div class="media-preview-frame">
                <img th:if="${media.mediaType == 'IMAGE'}" th:src="${media.mediaUrl}" alt="">
                <video th:if="${media.mediaType == 'VIDEO'}" controls th:src="${media.mediaUrl}"></video>
                <span th:if="${media.isThumbnail}" class="media-badge">Ảnh đại diện</span>
            </div>
            <div class="media-card-body">
                <strong th:text="${media.mediaType}"></strong>
                <span th:if="${media.slotType != null}" th:text="${'Góc chụp: ' + media.slotType}"></span>
                <span th:if="${media.slotType == null}">Video</span>
                <label>Caption
                    <input type="text" name="captions" th:value="${media.caption}" th:disabled="${!isEditable}" form="mediaOrderForm" placeholder="Nhập chú thích ảnh/video">
                </label>
                <label>Thứ tự hiển thị
                    <input type="hidden" name="mediaIds" th:value="${media.mediaId}" form="mediaOrderForm">
                    <span class="media-order-stepper">
                        <button type="button" class="media-order-btn" data-order-step="-1" th:disabled="${!isEditable}">−</button>
                        <input class="media-order-input" type="number" name="displayOrders" min="1" th:value="${media.displayOrder}" readonly th:disabled="${!isEditable}" form="mediaOrderForm">
                        <button type="button" class="media-order-btn" data-order-step="1" th:disabled="${!isEditable}">+</button>
                    </span>
                </label>
            </div>
            <div class="actions" th:if="${isEditable}">
                <form method="post" th:action="@{/artisan/products/{productId}/media/{mediaId}/thumbnail(productId=${product.productId},mediaId=${media.mediaId})}">
                    <button type="submit">Đặt làm ảnh đại diện</button>
                </form>
                <form method="post" th:action="@{/artisan/products/{productId}/media/{mediaId}/delete(productId=${product.productId},mediaId=${media.mediaId})}">
                    <button type="submit">Xóa</button>
                </form>
            </div>
        </article>
    </section>
</main>
</div>

<script>
    const mediaFileInput = document.getElementById('mediaFileInput');
    const shotTypeSelect = document.getElementById('shotTypeSelect');

    function syncShotTypeRequirement() {
        const file = mediaFileInput.files[0];
        const isVideo = file && file.type.startsWith('video/');

        shotTypeSelect.required = !isVideo;
        shotTypeSelect.disabled = isVideo;
        if (isVideo) {
            shotTypeSelect.value = '';
        }
    }

    mediaFileInput.addEventListener('change', syncShotTypeRequirement);
    syncShotTypeRequirement();

    document.querySelectorAll('.media-order-btn').forEach(button => {
        button.addEventListener('click', function () {
            const stepper = button.closest('.media-order-stepper');
            const input = stepper ? stepper.querySelector('.media-order-input') : null;
            if (!input) {
                return;
            }
            const step = Number(button.dataset.orderStep || 0);
            const currentValue = Number(input.value || 1);
            input.value = Math.max(1, currentValue + step);
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const successFlash = document.getElementById('artisanFlashSuccess');
        const errorFlash = document.getElementById('artisanFlashError');

        if (successFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.success(successFlash.dataset.message);
        }

        if (errorFlash?.dataset.message && window.BSMSToast) {
            BSMSToast.error(errorFlash.dataset.message);
        }
    });
</script>
</body>
</html>

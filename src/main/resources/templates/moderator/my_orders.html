<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#moderator-content}, ~{::#page-styles}, ~{::#page-scripts})}"
      th:with="paramActivePage='my-orders'">
<head>
    <title>&#272;&#417;n h&#224;ng c&#7911;a t&#244;i - Moderator Portal</title>
    <th:block id="page-styles">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/moderator-orders.css">
        <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
        <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
        <style>
            .my-kpi-grid {
                display: grid;
                grid-template-columns: repeat(6, minmax(0, 1fr));
                gap: 16px;
                margin-bottom: 24px;
            }
            @media (max-width: 1200px) { .my-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
            @media (max-width: 768px) { .my-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
            @media (max-width: 520px) { .my-kpi-grid { grid-template-columns: 1fr; } }

            .my-kpi-card {
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 16px 18px;
                cursor: pointer;
                user-select: none;
                transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 92px;
            }
            .my-kpi-card:hover { border-color: #cbd5e0; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04); }
            .my-kpi-card.active { border-color: #2b6cb0; background-color: #f7fafc; box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.2); }
            .my-kpi-card .kpi-title { font-size: 13px; font-weight: 600; line-height: 1.35; color: #4a5568; margin-bottom: 10px; }
            .my-kpi-card .kpi-count { font-size: 22px; line-height: 1.1; font-weight: 700; color: #1a202c; font-variant-numeric: tabular-nums; }
            .my-kpi-card.card-critical { border-top: 3px solid #e53e3e; }
            .my-kpi-card.card-approval { border-top: 3px solid #dd6b20; }
            .my-kpi-card.card-payment { border-top: 3px solid #d69e2e; }
            .my-kpi-card.card-delivery { border-top: 3px solid #319795; }
            .my-kpi-card.card-completed { border-top: 3px solid #38a169; }
            .my-kpi-card.card-cancelled { border-top: 3px solid #a0aec0; }

            .my-toolbar {
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 16px;
                margin-bottom: 20px;
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
                justify-content: flex-start;
            }
            .my-toolbar-search { position: relative; flex: 1 1 420px; min-width: 320px; }
            .my-toolbar-search input {
                width: 100%;
                height: 40px;
                padding: 8px 12px 8px 36px;
                border: 1px solid #cbd5e0;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
            }
            .my-toolbar-search input:focus { border-color: #3182ce; box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.15); }
            .my-toolbar-search .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #a0aec0; font-size: 14px; }
            .my-toolbar-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
            .my-toolbar-filters select {
                height: 40px;
                padding: 8px 12px;
                border: 1px solid #cbd5e0;
                border-radius: 6px;
                font-size: 13px;
                color: #2d3748;
                background-color: #ffffff;
                outline: none;
                cursor: pointer;
                max-width: 100%;
            }
            #priorityFilterSelect { width: 180px; }
            #statusFilterSelect { width: 220px; }
            #orderSortSelect { width: 170px; }
            .my-toolbar-filters select:focus { border-color: #3182ce; }
            @media (max-width: 900px) {
                .my-toolbar-search { flex-basis: 100%; min-width: 0; }
                .my-toolbar-filters { width: 100%; }
            }

            .my-orders-table-wrapper {
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                overflow-x: auto;
                overflow-y: visible;
            }
            .my-orders-table {
                width: 100%;
                min-width: 1100px;
                border-collapse: collapse;
                text-align: left;
                font-size: 14px;
                table-layout: fixed;
            }
            .my-orders-table th {
                background-color: #f7fafc;
                color: #4a5568;
                font-weight: 600;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 14px 18px;
                border-bottom: 1px solid #e2e8f0;
                white-space: nowrap;
            }
            .my-orders-table td {
                padding: 14px 18px;
                border-bottom: 1px solid #edf2f7;
                vertical-align: middle;
                color: #2d3748;
                overflow: visible;
                text-overflow: clip;
            }
            .my-orders-table tbody tr:hover { background-color: #f8fafc; }
            .my-orders-table .col-code { font-family: monospace; font-weight: 700; color: #2b6cb0; letter-spacing: 0.02em; white-space: nowrap; }
            .my-orders-table .col-customer strong { display: block; font-weight: 600; font-size: 14px; line-height: 1.35; white-space: normal; overflow-wrap: anywhere; }
            .my-orders-table .col-customer .cust-phone { display: block; margin-top: 3px; font-size: 12px; line-height: 1.3; color: #718096; white-space: nowrap; }
            .my-orders-table .col-money { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; font-weight: 600; white-space: nowrap; }
            .my-orders-table .col-priority,
            .my-orders-table .col-age,
            .my-orders-table .col-status,
            .my-orders-table .col-action { text-align: center; }
            .my-orders-table .col-age { font-size: 13px; color: #4a5568; white-space: nowrap; }
            .my-orders-table .col-action { padding-right: 22px; white-space: nowrap; }
            .badge-priority, .badge-status { display: inline-block; white-space: nowrap; }
            .badge-priority { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
            .badge-priority-critical { background: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
            .badge-priority-high { background: #feebc8; color: #7b341e; border: 1px solid #fbd38d; }
            .badge-priority-normal { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
            .badge-priority-low { background: #edf2f7; color: #4a5568; border: 1px solid #e2e8f0; }
            .badge-status { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
            .badge-status-pending { background: #fffaf0; color: #dd6b20; border: 1px solid #fbd38d; }
            .badge-status-pending_payment { background: #fefcbf; color: #744210; border: 1px solid #faf089; }
            .badge-status-deposited { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
            .badge-status-paid { background: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
            .badge-status-completed { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
            .badge-status-cancelled { background: #edf2f7; color: #4a5568; border: 1px solid #e2e8f0; }
            .btn-view-detail {
                min-width: 86px;
                color: #2b6cb0;
                background: #ebf8ff;
                border: 1px solid #bee3f8;
                padding: 6px 12px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: 600;
                text-decoration: none;
                display: inline-block;
                white-space: nowrap;
                transition: background 0.15s ease;
            }
            .btn-view-detail:hover { background: #bee3f8; color: #2b6cb0; }
            .my-pagination-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                min-width: 1100px;
                padding: 14px 18px;
                background: #ffffff;
                border-top: 1px solid #edf2f7;
                font-size: 13px;
                color: #718096;
            }
        </style>
    </th:block>
</head>
<body>
    <div id="moderator-content">
        <section class="my-kpi-grid">
            <div class="my-kpi-card card-critical" id="cardCritical" data-filter="CRITICAL">
                <div class="kpi-title">Kh&#7849;n c&#7845;p</div>
                <div class="kpi-count" id="kpiCriticalCount" th:text="${kpis != null ? kpis.criticalCount : 0}">0</div>
            </div>
            <div class="my-kpi-card card-approval" id="cardApproval" data-filter="WAITING_APPROVAL">
                <div class="kpi-title">Ch&#7901; t&#244;i duy&#7879;t</div>
                <div class="kpi-count" id="kpiApprovalCount" th:text="${kpis != null ? kpis.waitingApprovalCount : 0}">0</div>
            </div>
            <div class="my-kpi-card card-payment" id="cardPayment" data-filter="WAITING_CUSTOMER_PAYMENT">
                <div class="kpi-title">Ch&#7901; kh&#225;ch thanh to&#225;n</div>
                <div class="kpi-count" id="kpiPaymentCount" th:text="${kpis != null ? kpis.waitingPaymentCount : 0}">0</div>
            </div>
            <div class="my-kpi-card card-delivery" id="cardDelivery" data-filter="WAITING_DELIVERY_PAYMENT">
                <div class="kpi-title">Ch&#7901; giao &amp; thu n&#7889;t</div>
                <div class="kpi-count" id="kpiDeliveryCount" th:text="${kpis != null ? kpis.waitingDeliveryCount : 0}">0</div>
            </div>
            <div class="my-kpi-card card-completed" id="cardCompleted" data-filter="COMPLETED">
                <div class="kpi-title">&#272;&#227; ho&#224;n th&#224;nh</div>
                <div class="kpi-count" id="kpiCompletedCount" th:text="${kpis != null ? kpis.completedCount : 0}">0</div>
            </div>
            <div class="my-kpi-card card-cancelled" id="cardCancelled" data-filter="CANCELLED">
                <div class="kpi-title">&#272;&#227; h&#7911;y</div>
                <div class="kpi-count" id="kpiCancelledCount" th:text="${kpis != null ? kpis.cancelledCount : 0}">0</div>
            </div>
        </section>

        <div class="my-toolbar">
            <div class="my-toolbar-search">
                <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="orderSearchInput" placeholder="T&#236;m theo m&#227; &#273;&#417;n, t&#234;n kh&#225;ch h&#224;ng, s&#7889; &#273;i&#7879;n tho&#7841;i..." th:value="${search}">
            </div>

            <div class="my-toolbar-filters">
                <select id="priorityFilterSelect">
                    <option value="ALL" th:selected="${priority == 'ALL'}">T&#7845;t c&#7843; &#273;&#7897; &#432;u ti&#234;n</option>
                    <option value="CRITICAL" th:selected="${priority == 'CRITICAL'}">Kh&#7849;n c&#7845;p (CRITICAL)</option>
                    <option value="HIGH" th:selected="${priority == 'HIGH'}">Cao (HIGH)</option>
                    <option value="NORMAL" th:selected="${priority == 'NORMAL'}">B&#236;nh th&#432;&#7901;ng (NORMAL)</option>
                    <option value="LOW" th:selected="${priority == 'LOW'}">Th&#7845;p (LOW)</option>
                </select>

                <select id="statusFilterSelect">
                    <option value="ALL" th:selected="${status == 'ALL'}">T&#7845;t c&#7843; tr&#7841;ng th&#225;i</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">Ch&#7901; duy&#7879;t (PENDING)</option>
                    <option value="PENDING_PAYMENT" th:selected="${status == 'PENDING_PAYMENT'}">Ch&#7901; thanh to&#225;n (PENDING_PAYMENT)</option>
                    <option value="DEPOSITED" th:selected="${status == 'DEPOSITED'}">&#272;&#227; &#273;&#7863;t c&#7885;c (DEPOSITED)</option>
                    <option value="PAID" th:selected="${status == 'PAID'}">&#272;&#227; thanh to&#225;n (PAID)</option>
                    <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Ho&#224;n th&#224;nh (COMPLETED)</option>
                    <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">&#272;&#227; h&#7911;y (CANCELLED)</option>
                </select>

                <select id="orderSortSelect">
                    <option value="date_desc" th:selected="${sort == 'date_desc'}">M&#7899;i nh&#7845;t x&#7871;p tr&#432;&#7899;c</option>
                    <option value="date_asc" th:selected="${sort == 'date_asc'}">C&#361; nh&#7845;t x&#7871;p tr&#432;&#7899;c</option>
                    <option value="price_desc" th:selected="${sort == 'price_desc'}">Gi&#225; tr&#7883; l&#7899;n nh&#7845;t</option>
                    <option value="price_asc" th:selected="${sort == 'price_asc'}">Gi&#225; tr&#7883; nh&#7887; nh&#7845;t</option>
                </select>
            </div>
        </div>

        <div class="my-orders-table-wrapper">
            <table class="my-orders-table">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 24%;">
                    <col style="width: 11%;">
                    <col style="width: 11%;">
                    <col style="width: 10%;">
                    <col style="width: 9%;">
                    <col style="width: 11%;">
                    <col style="width: 14%;">
                </colgroup>
                <thead>
                    <tr>
                        <th>M&#227; &#273;&#417;n</th>
                        <th>Kh&#225;ch h&#224;ng</th>
                        <th style="text-align: right;">&#272;&#227; c&#7885;c</th>
                        <th style="text-align: right;">C&#242;n l&#7841;i</th>
                        <th style="text-align: center;">&#272;&#7897; &#432;u ti&#234;n</th>
                        <th style="text-align: center;">T&#7891;n</th>
                        <th style="text-align: center;">Tr&#7841;ng th&#225;i</th>
                        <th style="text-align: center;">Thao t&#225;c</th>
                    </tr>
                </thead>
                <tbody id="myOrdersTableBody">
                    <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                        <td colspan="8" style="text-align: center; padding: 40px; color: #a0aec0; font-style: italic;">
                            Kh&#244;ng t&#236;m th&#7845;y &#273;&#417;n h&#224;ng n&#224;o ph&#249; h&#7907;p
                        </td>
                    </tr>
                    <tr th:each="order : ${orders}">
                        <td class="col-code" th:text="${order.orderCode}">BSMS-000000</td>
                        <td class="col-customer">
                            <strong th:text="${order.customerName}">Kh&#225;ch h&#224;ng</strong>
                            <span class="cust-phone" th:text="${order.customerPhone}">-</span>
                        </td>
                        <td class="col-money" th:utext="${order.depositAmount != null ? #numbers.formatDecimal(order.depositAmount, 0, 'POINT', 0, 'COMMA') + ' &#8363;' : '0 &#8363;'}">0 &#8363;</td>
                        <td class="col-money" th:utext="${order.remainingPaymentAmount != null ? #numbers.formatDecimal(order.remainingPaymentAmount, 0, 'POINT', 0, 'COMMA') + ' &#8363;' : '0 &#8363;'}">0 &#8363;</td>
                        <td class="col-priority">
                            <span th:class="'badge-priority badge-priority-' + ${#strings.toLowerCase(order.priority != null ? order.priority : 'normal')}"
                                  th:text="${order.priority != null ? order.priority : 'NORMAL'}">NORMAL</span>
                        </td>
                        <td class="col-age">
                            <span class="age-timer-element"
                                  th:data-timestamp="${order.statusTimestamp != null ? order.statusTimestamp : ''}"
                                  th:text="${order.ageFormatted}">-</span>
                        </td>
                        <td class="col-status">
                            <span th:class="'badge-status badge-status-' + ${#strings.toLowerCase(order.orderStatus != null ? order.orderStatus : 'pending')}"
                                  th:text="${order.orderStatus}">PENDING</span>
                        </td>
                        <td class="col-action">
                            <a th:href="@{/moderator/orders/{code}(code=${order.orderCode})}" class="btn-view-detail">Chi ti&#7871;t</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="my-pagination-footer">
                <div id="paginationInfo">Hi&#7875;n th&#7883; &#273;&#417;n h&#224;ng</div>
                <div id="paginationControls" class="d-flex gap-1"></div>
            </div>
        </div>
    </div>

    <th:block id="page-scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/my_orders.js"></script>
    </th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('seller-profile')}"></div>

    <main class="dashboard-main">
        <div th:replace="~{fragments/seller-topbar :: topbar('Profile Settings')}"></div>
        <header class="page-header">
            <div>
                <h1>My Profile</h1>
                <p>Thông tin tài khoản seller của bạn.</p>
            </div>
            <a class="btn secondary" th:href="@{/seller}">Back to Dashboard</a>
        </header>

        <section class="seller-profile-card">
            <div class="seller-profile-header">
                <div class="seller-profile-avatar">
                    <img th:if="${seller.avatar != null}" th:src="${seller.avatar}" alt="avatar">
                    <span th:if="${seller.avatar == null}" th:text="${#strings.substring(seller.fullName, 0, 1)}">S</span>
                </div>
                <div>
                    <h2 th:text="${seller.fullName}">Seller Name</h2>
                    <p th:text="${seller.email}">seller@example.com</p>
                    <span class="status-chip" th:text="${seller.status}">ACTIVE</span>
                </div>
            </div>

            <div class="seller-profile-fields">
                <div class="profile-row">
                    <span>👤</span>
                    <div>
                        <small>Họ và tên</small>
                        <strong th:text="${seller.fullName}">-</strong>
                    </div>
                </div>
                <div class="profile-row">
                    <span>🆔</span>
                    <div>
                        <small>Tên đăng nhập</small>
                        <strong th:text="${seller.username != null ? seller.username : 'Chưa cập nhật'}">-</strong>
                    </div>
                </div>
                <div class="profile-row">
                    <span>📧</span>
                    <div>
                        <small>Email</small>
                        <strong th:text="${seller.email}">-</strong>
                    </div>
                </div>
                <div class="profile-row">
                    <span>📱</span>
                    <div>
                        <small>Số điện thoại</small>
                        <strong th:text="${seller.phone != null ? seller.phone : 'Chưa cập nhật'}">-</strong>
                    </div>
                </div>
                <div class="profile-row">
                    <span>🏠</span>
                    <div>
                        <small>Địa chỉ</small>
                        <strong th:text="${seller.address != null ? seller.address : 'Chưa cập nhật'}">-</strong>
                    </div>
                </div>
                <div class="profile-row">
                    <span>📅</span>
                    <div>
                        <small>Ngày tham gia</small>
                        <strong th:text="${#temporals.format(seller.createdAt, 'dd/MM/yyyy')}">-</strong>
                    </div>
                </div>
            </div>

            <div class="actions seller-profile-actions">
                <a class="btn" th:href="@{/seller/profile/update}">Edit Profile</a>
                <a class="btn secondary" th:href="@{/seller/profile/change-password}">Change Password</a>
            </div>
        </section>
    </main>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Media Upload</title>
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</head>
<body>
<main class="container">
    <header class="page-header">
        <div>
            <h1>Step 2: Media Upload</h1>
            <p th:text="${product.productName}">Product</p>
        </div>
        <div class="actions">
            <a class="btn secondary" th:href="@{/seller/products}">Back to My Products</a>
            <a class="btn" th:href="@{/seller/products/{id}/preview(id=${product.productId})}">Preview</a>
        </div>
    </header>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <form class="form-card" method="post" enctype="multipart/form-data"
          th:action="@{/seller/products/{id}/media(id=${product.productId})}">
        <label>File ảnh/video
            <input id="mediaFileInput" type="file" name="file" accept="image/*,video/mp4,video/webm" required>
        </label>
        <label>Shot type
            <select id="shotTypeSelect" name="slotType">
                <option value="">-- Chọn góc chụp --</option>
                <option value="FRONT">FRONT - Chính diện</option>
                <option value="BACK">BACK - Mặt sau</option>
                <option value="LEFT">LEFT - Bên trái</option>
                <option value="RIGHT">RIGHT - Bên phải</option>
                <option value="TOP">TOP - Từ trên xuống</option>
                <option value="DETAIL">DETAIL - Cận cảnh chi tiết</option>
                <option value="ROOT">ROOT - Cận cảnh bộ rễ</option>
                <option value="TRUNK">TRUNK - Cận cảnh thân cây</option>
                <option value="BRANCH">BRANCH - Cận cảnh cành</option>
                <option value="POT">POT - Cận cảnh chậu bonsai</option>
                <option value="OVERVIEW">OVERVIEW - Tổng quan</option>
            </select>
        </label>
        <label>Caption
            <input name="caption">
        </label>
        <p class="form-hint">Thứ tự ban đầu sẽ tự động theo thứ tự upload. Bạn có thể chỉnh lại ở danh sách media bên dưới.</p>
        <label class="checkbox">
            <input type="checkbox" name="isThumbnail" value="true">
            Đặt làm thumbnail
        </label>
        <button type="submit">Upload Media</button>
    </form>

    <form id="mediaOrderForm" method="post" th:action="@{/seller/products/{id}/media/order(id=${product.productId})}"></form>
    <div class="actions media-toolbar" th:if="${!#lists.isEmpty(mediaList)}">
        <button type="submit" form="mediaOrderForm">Save Display Order</button>
    </div>

    <section class="media-grid">
        <article class="media-card" th:each="media : ${mediaList}">
            <img th:if="${media.mediaType == 'IMAGE'}" th:src="${media.mediaUrl}" alt="">
            <video th:if="${media.mediaType == 'VIDEO'}" controls th:src="${media.mediaUrl}"></video>
            <strong th:text="${media.isThumbnail ? 'Thumbnail' : media.mediaType}"></strong>
            <span th:if="${media.slotType != null}" th:text="${'Shot: ' + media.slotType}"></span>
            <span th:if="${media.slotType == null}">Video</span>
            <span th:text="${media.caption}"></span>
            <label>Display order
                <input type="hidden" name="mediaIds" th:value="${media.mediaId}" form="mediaOrderForm">
                <input type="number" name="displayOrders" min="0" th:value="${media.displayOrder}" form="mediaOrderForm">
            </label>
            <div class="actions">
                <form method="post" th:action="@{/seller/products/{productId}/media/{mediaId}/thumbnail(productId=${product.productId},mediaId=${media.mediaId})}">
                    <button type="submit">Set thumbnail</button>
                </form>
                <form method="post" th:action="@{/seller/products/{productId}/media/{mediaId}/delete(productId=${product.productId},mediaId=${media.mediaId})}">
                    <button type="submit">Delete</button>
                </form>
            </div>
        </article>
    </section>
</main>
<script>
    const mediaFileInput = document.getElementById('mediaFileInput');
    const shotTypeSelect = document.getElementById('shotTypeSelect');

    function syncShotTypeRequirement() {
        const file = mediaFileInput.files[0];
        const isVideo = file && file.type.startsWith('video/');

        shotTypeSelect.required = !isVideo;
        shotTypeSelect.disabled = isVideo;
        if (isVideo) {
            shotTypeSelect.value = '';
        }
    }

    mediaFileInput.addEventListener('change', syncShotTypeRequirement);
    syncShotTypeRequirement();
</script>
</body>
</html>

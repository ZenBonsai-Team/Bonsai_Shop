<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('seller-products')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <header class="page-header">
            <div>
                <h1>My Products</h1>
                <p>Quản lý sản phẩm thuộc seller đang đăng nhập.</p>
            </div>
            <a class="btn" th:href="@{/seller/products/new}">Create New Product</a>
        </header>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <section class="portal-card">
            <div class="product-toolbar">
                <input id="productSearch" placeholder="Search product name or code...">
                <div class="filter-chips">
                    <button type="button" class="filter-chip active" data-status="ALL">All</button>
                    <button type="button" class="filter-chip" data-status="AVAILABLE">Published</button>
                    <button type="button" class="filter-chip" data-status="DRAFT">Draft</button>
                    <button type="button" class="filter-chip" data-status="HIDDEN">Hidden</button>
                    <button type="button" class="filter-chip" data-status="SOLD">Sold</button>
                </div>
            </div>

            <table class="compact-table product-table">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="productTableBody">
                <tr th:each="product : ${products}"
                    th:attr="data-status=${product.productStatus},data-search-text=${product.productCode + ' ' + product.productName}">
                    <td th:text="${product.productCode}"></td>
                    <td th:text="${product.productName}"></td>
                    <td>
                        <span th:if="${product.isPublicPrice}" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT') + ' VNĐ'}"></span>
                        <span th:if="${!product.isPublicPrice}">Liên hệ</span>
                    </td>
                    <td><span class="status-chip" th:text="${product.productStatus}"></span></td>
                    <td class="table-actions">
                        <a th:if="${product.productStatus == 'DRAFT' || product.productStatus == 'HIDDEN'}" th:href="@{/seller/products/{id}/edit(id=${product.productId})}">Edit</a>
                        <a th:if="${product.productStatus == 'DRAFT' || product.productStatus == 'HIDDEN'}" th:href="@{/seller/products/{id}/media(id=${product.productId})}">Media</a>
                        <a th:href="@{/seller/products/{id}/preview(id=${product.productId})}">Preview</a>
                        <form th:if="${product.productStatus == 'DRAFT' || product.productStatus == 'HIDDEN'}" method="post" th:action="@{/seller/products/{id}/publish(id=${product.productId})}">
                            <button type="submit">Publish</button>
                        </form>
                        <form th:if="${product.productStatus == 'AVAILABLE'}" method="post" th:action="@{/seller/products/{id}/hide(id=${product.productId})}">
                            <button type="submit" class="text-warning" onclick="return confirm('Ẩn sản phẩm này khỏi marketplace?')">Hide</button>
                        </form>
                        <form th:if="${product.productStatus == 'DRAFT'}" method="post" th:action="@{/seller/products/{id}/delete(id=${product.productId})}">
                            <button type="submit" class="text-danger" onclick="return confirm('Xóa sản phẩm này?')">Delete</button>
                        </form>
                        <span th:if="${product.productStatus != 'DRAFT' && product.productStatus != 'HIDDEN' && product.productStatus != 'AVAILABLE'}" class="muted-text">Locked</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<script>
    const productSearch = document.getElementById('productSearch');
    const productRows = [...document.querySelectorAll('#productTableBody tr')];
    let currentStatus = 'ALL';

    function applyProductFilters() {
        const keyword = productSearch.value.trim().toLowerCase();
        productRows.forEach((row) => {
            const matchesStatus = currentStatus === 'ALL' || row.dataset.status === currentStatus;
            const matchesKeyword = !keyword || row.dataset.searchText.toLowerCase().includes(keyword);
            row.hidden = !(matchesStatus && matchesKeyword);
        });
    }

    document.querySelectorAll('.filter-chip').forEach((button) => {
        button.addEventListener('click', () => {
            document.querySelectorAll('.filter-chip').forEach((chip) => chip.classList.remove('active'));
            button.classList.add('active');
            currentStatus = button.dataset.status;
            applyProductFilters();
        });
    });

    productSearch.addEventListener('input', applyProductFilters);
</script>
</body>
</html>

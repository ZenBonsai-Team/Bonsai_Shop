<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</head>
<body>
<div class="dashboard-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('seller-profile')}"></div>

    <main class="dashboard-main">
        <header th:replace="~{fragments/header :: header}"></header>
        <header class="page-header">
            <div>
                <h1>Change Password</h1>
                <p>Cập nhật mật khẩu tài khoản seller.</p>
            </div>
            <a class="btn secondary" th:href="@{/seller/profile}">Back to My Profile</a>
        </header>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <section class="seller-profile-card">
            <form class="seller-profile-fields" method="post" th:action="@{/seller/profile/change-password}">
                <label class="profile-row">
                    <span>🔑</span>
                    <div>
                        <small>Mật khẩu hiện tại</small>
                        <input type="password" name="currentPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>🆕</span>
                    <div>
                        <small>Mật khẩu mới</small>
                        <input type="password" name="newPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>✅</span>
                    <div>
                        <small>Xác nhận mật khẩu mới</small>
                        <input type="password" name="confirmPassword" required>
                    </div>
                </label>

                <div class="actions">
                    <button type="submit">Save New Password</button>
                    <a class="btn secondary" th:href="@{/seller/profile}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>

</body>
</html>

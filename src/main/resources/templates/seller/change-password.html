<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/seller.css}">
</head>
<body>
<div class="seller-portal">
    <aside class="seller-sidebar">
        <h2>Seller Portal</h2>
        <nav>
            <a th:href="@{/seller}">Dashboard</a>
            <a th:href="@{/seller/products}">My Products</a>
            <a th:href="@{/seller/catalog}">Catalog</a>
            <a class="active" th:href="@{/seller/profile}">My Profile</a>
            <a href="#">Appointments</a>
        </nav>
        <form method="post" th:action="@{/logout}">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="sidebar-logout">Logout</button>
        </form>
    </aside>

    <main class="portal-content">
        <header class="page-header">
            <div>
                <h1>Change Password</h1>
                <p>Cập nhật mật khẩu tài khoản seller.</p>
            </div>
            <a class="btn secondary" th:href="@{/seller/profile}">Back to My Profile</a>
        </header>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <section class="seller-profile-card">
            <form class="seller-profile-fields" method="post" th:action="@{/seller/profile/change-password}">
                <label class="profile-row">
                    <span>🔑</span>
                    <div>
                        <small>Mật khẩu hiện tại</small>
                        <input type="password" name="currentPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>🆕</span>
                    <div>
                        <small>Mật khẩu mới</small>
                        <input type="password" name="newPassword" required>
                    </div>
                </label>
                <label class="profile-row">
                    <span>✅</span>
                    <div>
                        <small>Xác nhận mật khẩu mới</small>
                        <input type="password" name="confirmPassword" required>
                    </div>
                </label>

                <div class="actions">
                    <button type="submit">Save New Password</button>
                    <a class="btn secondary" th:href="@{/seller/profile}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>

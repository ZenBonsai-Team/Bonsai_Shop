<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#admin-dashboard-content}, ~{::styles}, ~{})}">
<head>
    <title>Quản trị - Bonsai Shop</title>
    <th:block th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
</head>
<body>

<div id="admin-dashboard-content" th:with="paramActivePage='dashboard'">
    <header class="dashboard-header">
        <div>
            <h1 class="serif-text mb-1">Bảng điều khiển</h1>
            <p class="text-secondary mb-0">Tổng quan hệ thống và hoạt động quản trị.</p>
        </div>
    </header>

    <section class="dashboard-kpis">
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fa-solid fa-users"></i></div>
            <div class="kpi-info">
                <strong>150</strong>
                <span>Total Users</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fa-solid fa-leaf"></i></div>
            <div class="kpi-info">
                <strong>340</strong>
                <span>Total Bonsai</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fa-solid fa-chart-line"></i></div>
            <div class="kpi-info">
                <strong>1.2B VNĐ</strong>
                <span>Revenue</span>
            </div>
        </div>
    </section>

    <section class="dashboard-content-box mt-4">
        <h2 class="serif-text mb-3">Hoạt động gần đây</h2>
        <p class="text-secondary">Tính năng này đang được phát triển...</p>
    </section>
</div>

</body>
</html>

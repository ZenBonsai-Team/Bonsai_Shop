<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#owner-sold-trees-content}, ~{::styles}, ~{::scripts})}">
<head>
    <title>Sold Trees - Minh Ky Garden</title>
    <th:block th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
    <th:block th:fragment="scripts">
        <script th:src="@{/js/owner-report-pagination.js}"></script>
    </th:block>
</head>
<body>

<div id="owner-sold-trees-content" class="owner-report-page" th:with="paramActivePage='dashboard'">
    <header class="owner-report-header">
        <div>
            <span class="owner-eyebrow">Owner Dashboard</span>
            <h1>Sold Trees</h1>
            <p>Completed sales with the sold date and time for each tree.</p>
        </div>
        <a class="owner-back-link" th:href="@{/owner}">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>
    </header>

    <section class="owner-panel owner-report-panel">
        <div class="owner-report-summary">
            <span>Total sold entries</span>
            <strong th:text="${#lists.size(soldTrees)}">0</strong>
        </div>

        <div class="owner-report-table-wrap">
            <table class="owner-report-table">
                <thead>
                <tr>
                    <th>Tree</th>
                    <th>Artisan</th>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Sold Date</th>
                    <th>Sold Time</th>
                    <th class="text-end">Amount</th>
                </tr>
                </thead>
                <tbody data-owner-paginated-list data-page-size="10" data-report-label="sold trees">
                <tr th:each="tree : ${soldTrees}" data-page-entry>
                    <td>
                        <a class="owner-tree-link" th:href="@{/product/{id}(id=${tree.productId()})}" th:text="${tree.productName()}">Tree name</a>
                        <small>
                            <span th:text="${tree.productCode()}">TREE001</span>
                            <span th:if="${tree.varietyName() != null}" th:text="| - ${tree.varietyName()}|"> - Variety</span>
                        </small>
                    </td>
                    <td th:text="${tree.artisanName() ?: '-'}">Artisan</td>
                    <td th:text="${tree.orderCode()}">ORDER001</td>
                    <td th:text="${tree.customerName() ?: '-'}">Customer</td>
                    <td th:text="${tree.soldAt() != null ? #temporals.format(tree.soldAt(), 'dd/MM/yyyy') : '-'}">11/08/2026</td>
                    <td th:text="${tree.soldAt() != null ? #temporals.format(tree.soldAt(), 'HH:mm') : '-'}">13:10</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(tree.soldAmount(), 0, 'POINT', 0, 'POINT') + ' VND'}">0 VND</td>
                </tr>
                <tr th:if="${#lists.isEmpty(soldTrees)}">
                    <td colspan="7" class="owner-empty-state">No sold trees are available yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination-footer owner-report-pagination" data-owner-pagination hidden>
            <div class="pagination-info" data-owner-pagination-info></div>
            <div class="pagination-controls" data-owner-pagination-controls></div>
        </div>
    </section>
</div>

</body>
</html>

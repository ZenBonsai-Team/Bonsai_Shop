<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#owner-garden-trees-content}, ~{::styles}, ~{})}">
<head>
    <title>Trees in Garden - Minh Ky Garden</title>
    <th:block th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </th:block>
</head>
<body>

<div id="owner-garden-trees-content" class="owner-report-page" th:with="paramActivePage='dashboard'">
    <header class="owner-report-header">
        <div>
            <span class="owner-eyebrow">Owner Dashboard</span>
            <h1>Trees in the Garden</h1>
            <p>Current inventory that has not been marked as sold.</p>
        </div>
        <a class="owner-back-link" th:href="@{/owner}">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>
    </header>

    <section class="owner-panel owner-report-panel">
        <div class="owner-report-summary">
            <span>Trees remaining</span>
            <strong th:text="${#lists.size(gardenTrees)}">0</strong>
        </div>

        <div class="owner-report-table-wrap">
            <table class="owner-report-table">
                <thead>
                <tr>
                    <th>Tree</th>
                    <th>Variety</th>
                    <th>Artisan</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Views</th>
                    <th class="text-end">Price</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tree : ${gardenTrees}">
                    <td>
                        <a class="owner-tree-link" th:href="@{/product/{id}(id=${tree.productId()})}" th:text="${tree.productName()}">Tree name</a>
                        <small th:text="${tree.productCode()}">TREE001</small>
                    </td>
                    <td th:text="${tree.varietyName() ?: '-'}">Variety</td>
                    <td th:text="${tree.artisanName() ?: '-'}">Artisan</td>
                    <td><span class="owner-status-pill" th:text="${tree.productStatus() ?: 'UNKNOWN'}">AVAILABLE</span></td>
                    <td th:text="${tree.createdAt() != null ? #temporals.format(tree.createdAt(), 'dd/MM/yyyy HH:mm') : '-'}">11/08/2026 13:10</td>
                    <td th:text="${tree.viewCount()}">0</td>
                    <td class="text-end" th:text="${tree.price() != null ? #numbers.formatDecimal(tree.price(), 0, 'POINT', 0, 'POINT') + ' VND' : '-'}">0 VND</td>
                </tr>
                <tr th:if="${#lists.isEmpty(gardenTrees)}">
                    <td colspan="7" class="owner-empty-state">No trees remain in the garden.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

</body>
</html>

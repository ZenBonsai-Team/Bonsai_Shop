<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo tài khoản</title>
    <link rel="stylesheet" th:href="@{/css/admin_user_list.css}"/>
    <style>
        .create-form {
            background: white;
            border-radius: 12px;
            padding: 36px;
            max-width: 520px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .create-form h2 {
            color: #1b4332;
            margin-bottom: 28px;
            font-size: 20px;
        }
        .form-field { margin-bottom: 20px; }
        .form-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 7px;
        }
        .form-field input,
        .form-field select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-field input:focus,
        .form-field select:focus {
            border-color: #2d6a4f;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        .btn-create {
            flex: 1;
            padding: 13px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-create:hover { background: #1b4332; }
        .btn-cancel {
            flex: 1;
            padding: 13px;
            background: #f4f4f3;
            color: #444;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="admin-container">

    <div class="admin-header">
        <h1>➕ Tạo tài khoản mới</h1>
        <a th:href="@{/owner/users}" class="btn-home">← Quay lại</a>
    </div>

    <div th:if="${error}" th:text="${error}" class="alert alert-error"></div>

    <div class="create-form">
        <h2>Thông tin tài khoản</h2>

        <form method="post" th:action="@{/owner/users/create}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-field">
                <label>Họ và tên *</label>
                <input type="text" name="fullName" placeholder="Nguyễn Văn A" required/>
            </div>

            <div class="form-field">
                <label>Email *</label>
                <input type="email" name="email" placeholder="example@email.com" required/>
            </div>

            <div class="form-field">
                <label>Mật khẩu *</label>
                <input type="password" name="password"
                       placeholder="Tối thiểu 6 ký tự" required minlength="6"/>
            </div>

            <div class="form-field">
                <label>Số điện thoại</label>
                <input type="text" name="phone" placeholder="0xxxxxxxxx"/>
            </div>

            <div class="form-field">
                <label>Phân quyền *</label>
                <select name="roleId" required>
                    <option value="">-- Chọn quyền --</option>
                    <option th:each="role : ${roles}"
                            th:value="${role.roleId}"
                            th:text="${role.roleName}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-create">✅ Tạo tài khoản</button>
                <a th:href="@{/owner/users}" class="btn-cancel">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="vi"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#create-user-content}, ~{::styles}, ~{::scripts})}">

<head>
    <title>Tạo tài khoản - Bonsai Shop</title>

    <th:block th:fragment="styles">
        <link rel="stylesheet"
              th:href="@{/css/admin_create_user.css}">
    </th:block>
</head>

<body>

<div id="create-user-content"
     th:with="paramActivePage='users'">

    <div th:if="${error}"
         th:text="${error}"
         class="alert alert-error">
    </div>

    <div class="dashboard-header mb-4">
        <div>
            <h1 class="serif-text mb-0">
                Tạo tài khoản mới
            </h1>
        </div>

        <a th:href="@{/owner/users}"
           class="btn-back">
            ← Quay lại
        </a>
    </div>

    <div class="create-form">

        <h2 class="serif-text">
            Thông tin tài khoản
        </h2>

        <form method="post"
              th:action="@{/owner/users/create}">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="form-field">
                <label>Họ và tên *</label>
                <label>
                    <input type="text"
                           name="fullName"
                           placeholder="Nguyễn Văn A"
                           required>
                </label>
            </div>

            <div class="form-field">
                <label>Email *</label>
                <label>
                    <input type="email"
                           name="email"
                           placeholder="example@email.com"
                           required>
                </label>
            </div>

            <div class="form-field">
                <label>Mật khẩu *</label>
                <label>
                    <input type="password"
                           name="password"
                           placeholder="Tối thiểu 6 ký tự"
                           minlength="6"
                           required>
                </label>
            </div>

            <div class="form-field">
                <label>Số điện thoại</label>
                <label>
                    <input type="text"
                           name="phone"
                           placeholder="0xxxxxxxxx">
                </label>
            </div>

            <div class="form-field">
                <label>Phân quyền *</label>

                <label>
                    <select name="roleId" required>

                        <option value="">
                            -- Chọn quyền --
                        </option>

                        <option th:each="role : ${roles}"
                                th:value="${role.roleId}"
                                th:text="${role.roleName}">
                        </option>

                    </select>
                </label>
            </div>

            <div class="form-actions">

                <button type="submit"
                        class="btn-create">
                    Tạo tài khoản
                </button>

                <a th:href="@{/owner/users}"
                   class="btn-cancel">
                    Hủy
                </a>

            </div>
        </form>
    </div>
</div>

<th:block th:fragment="scripts">
</th:block>

</body>
</html>

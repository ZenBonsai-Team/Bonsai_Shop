<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/dashboard-layout :: layout(~{::title}, ~{::#system-config-content}, ~{::styles}, ~{::scripts})}">
<head>
    <title>Cấu hình hệ thống - Minh Kỷ Garden</title>
    <th:block th:fragment="styles">
        <style>
            .config-card {
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 16px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
                margin-bottom: 2rem;
                overflow: hidden;
            }
            .config-card-header {
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
                padding: 1.25rem 1.5rem;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }
            .config-card-header h2 {
                font-size: 1.25rem;
                font-weight: 700;
                color: #0f172a;
                margin: 0;
            }
            .config-card-body {
                padding: 1.5rem;
            }
            .preview-img-container {
                width: 100%;
                max-height: 180px;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #cbd5e1;
                margin-top: 10px;
                background: #f1f5f9;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .preview-img-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .submit-bar {
                position: sticky;
                bottom: 0;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(8px);
                border-top: 1px solid #e2e8f0;
                padding: 1rem 1.5rem;
                display: flex;
                justify-content: flex-end;
                z-index: 10;
                margin-top: 2rem;
                border-radius: 0 0 16px 16px;
            }
            .btn-save-config {
                background: #2e7d32;
                color: #ffffff;
                border: none;
                padding: 0.75rem 2rem;
                border-radius: 50px;
                font-weight: 600;
                transition: all 0.2s ease;
                box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
            }
            .btn-save-config:hover {
                background: #1b5e20;
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
            }
        </style>
    </th:block>
</head>
<body>

<div id="system-config-content" th:with="paramActivePage='system-config'">
    <div class="dashboard-header mb-4">
        <div>
            <h1 class="serif-text mb-0">Cấu hình hệ thống</h1>
            <p class="text-secondary mb-0">Quản lý banner, tiêu đề và hình ảnh hiển thị của các trang chính</p>
        </div>
    </div>

    <div th:if="${success}" th:text="${success}" class="alert alert-success border-0 shadow-sm mb-4"></div>
    <div th:if="${error}" th:text="${error}" class="alert alert-error border-0 shadow-sm mb-4"></div>

    <form method="post" th:action="@{/owner/system-config}" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 1. TRANG CHỦ -->
        <div class="config-card">
            <div class="config-card-header">
                <i class="fa-solid fa-house text-success fs-4"></i>
                <h2>Cấu hình Trang Chủ (Home)</h2>
            </div>
            <div class="config-card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiêu đề Banner</label>
                            <input type="text" name="home_banner_title" 
                                   th:value="${sysConfig.getValue('home_banner_title', 'Minh Kỷ Garden')}" 
                                   class="form-control" placeholder="Nhập tiêu đề...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả Banner</label>
                            <textarea name="home_banner_subtitle" rows="3" class="form-control" 
                                      placeholder="Nhập mô tả chi tiết..."
                                      th:text="${sysConfig.getValue('home_banner_subtitle', 'Nâng tầm không gian sống bằng nghệ thuật tạo hình cây cảnh độc bản')}"></textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ảnh Banner</label>
                            <input type="file" name="home_banner_image_file" class="form-control mb-2" onchange="previewImage(this, 'home-preview')">
                            <input type="hidden" name="home_banner_image" th:value="${sysConfig.getValue('home_banner_image', '/images/hero-bonsai.png')}">
                            <div class="preview-img-container">
                                <img id="home-preview" th:src="${sysConfig.getValue('home_banner_image', '/images/hero-bonsai.png')}" alt="Home Banner Preview">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. CHỢ CÂY -->
        <div class="config-card">
            <div class="config-card-header">
                <i class="fa-solid fa-store text-success fs-4"></i>
                <h2>Cấu hình Chợ Cây (Marketplace)</h2>
            </div>
            <div class="config-card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiêu đề Banner</label>
                            <input type="text" name="marketplace_banner_title" 
                                   th:value="${sysConfig.getValue('marketplace_banner_title', 'Tác Phẩm Bonsai Di Sản & Nghệ Thuật Độc Bản')}" 
                                   class="form-control" placeholder="Nhập tiêu đề...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả Banner</label>
                            <textarea name="marketplace_banner_subtitle" rows="3" class="form-control" 
                                      placeholder="Nhập mô tả chi tiết..."
                                      th:text="${sysConfig.getValue('marketplace_banner_subtitle', 'Nơi lưu giữ hồn xưa đất Việt qua từng thế cây, dáng đá. Mỗi tác phẩm đều đi kèm hồ sơ nghệ nhân, phả hệ minh bạch và chứng nhận thẩm định từ nhà vườn.')}"></textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ảnh Banner</label>
                            <input type="file" name="marketplace_banner_image_file" class="form-control mb-2" onchange="previewImage(this, 'market-preview')">
                            <input type="hidden" name="marketplace_banner_image" th:value="${sysConfig.getValue('marketplace_banner_image', '/images/hero-banner-1.jpg')}">
                            <div class="preview-img-container">
                                <img id="market-preview" th:src="${sysConfig.getValue('marketplace_banner_image', '/images/hero-banner-1.jpg')}" alt="Marketplace Banner Preview">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. CỘNG ĐỒNG -->
        <div class="config-card">
            <div class="config-card-header">
                <i class="fa-solid fa-users text-success fs-4"></i>
                <h2>Cấu hình Cộng Đồng (Community)</h2>
            </div>
            <div class="config-card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiêu đề Banner</label>
                            <input type="text" name="community_banner_title" 
                                   th:value="${sysConfig.getValue('community_banner_title', 'Cộng Đồng Bonsai Việt Nam')}" 
                                   class="form-control" placeholder="Nhập tiêu đề...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả Banner</label>
                            <textarea name="community_banner_subtitle" rows="3" class="form-control" 
                                      placeholder="Nhập mô tả chi tiết..."
                                      th:text="${sysConfig.getValue('community_banner_subtitle', 'Nơi giao lưu, chia sẻ kinh nghiệm tạo tác và chăm sóc cây cảnh cùng các nghệ nhân hàng đầu.')}"></textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ảnh Banner</label>
                            <input type="file" name="community_banner_image_file" class="form-control mb-2" onchange="previewImage(this, 'community-preview')">
                            <input type="hidden" name="community_banner_image" th:value="${sysConfig.getValue('community_banner_image', '/images/hero-banner-1.jpg')}">
                            <div class="preview-img-container">
                                <img id="community-preview" th:src="${sysConfig.getValue('community_banner_image', '/images/hero-banner-1.jpg')}" alt="Community Banner Preview">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. HÀNG TUYỂN -->
        <div class="config-card">
            <div class="config-card-header">
                <i class="fa-solid fa-gem text-success fs-4"></i>
                <h2>Cấu hình Hàng Tuyển (Bonsai Luxury)</h2>
            </div>
            <div class="config-card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiêu đề Banner</label>
                            <input type="text" name="luxury_banner_title" 
                                   th:value="${sysConfig.getValue('luxury_banner_title', 'Hàng Tuyển Tác Phẩm Độc Bản')}" 
                                   class="form-control" placeholder="Nhập tiêu đề...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả Banner</label>
                            <textarea name="luxury_banner_subtitle" rows="3" class="form-control" 
                                      placeholder="Nhập mô tả chi tiết..."
                                      th:text="${sysConfig.getValue('luxury_banner_subtitle', 'Bộ sưu tập siêu phẩm Bonsai quý hiếm, đỉnh cao nghệ thuật dành cho các nhà sưu tầm thượng lưu.')}"></textarea>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ảnh Banner</label>
                            <input type="file" name="luxury_banner_image_file" class="form-control mb-2" onchange="previewImage(this, 'luxury-preview')">
                            <input type="hidden" name="luxury_banner_image" th:value="${sysConfig.getValue('luxury_banner_image', '/images/hero-banner-bonsai.jpg')}">
                            <div class="preview-img-container">
                                <img id="luxury-preview" th:src="${sysConfig.getValue('luxury_banner_image', '/images/hero-banner-bonsai.jpg')}" alt="Luxury Banner Preview">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="submit-bar">
            <button type="submit" class="btn-save-config">Lưu cấu hình</button>
        </div>
    </form>
</div>

<th:block th:fragment="scripts">
    <script>
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</th:block>
</body>
</html>

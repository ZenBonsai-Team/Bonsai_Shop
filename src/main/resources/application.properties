spring.application.name=Bonsai_Shop
# ================================================
# SERVER
# ================================================
server.port=8080
server.forward-headers-strategy=FRAMEWORK

# ================================================
# ACTIVE PROFILE & DATABASE
# ================================================
spring.profiles.active=local
# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================================================
spring.thymeleaf.cache=false

# ================================================
# FILE UPLOAD (ảnh sản phẩm)
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB

# ================================================
# EMAIL CONFIG (Sử dụng Gmail SMTP)
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================================================
# THÔNG BÁO LỖI
# ================================================

# UPLOAD CONFIG
file.upload-dir=uploads/avatars
file.product-media-dir=uploads/products
spring.web.resources.static-locations=classpath:/public/,file:uploads/
debug=true

# ================================================
# VNPAY CONFIGURATION (SANDBOX)
# ================================================
vnp.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp.tmn-code=URXDCBW6
vnp.hash-secret=TNSGXCCGSSXDGFRLMCUMFFWCNHJLRYRA
vnp.return-url=http://localhost:8080/vnpay/payment-callback

# CLOUDINARY CONFIG
cloudinary.cloud-name=cyfozgub
cloudinary.api-key=637351733373365
cloudinary.api-secret=oaJHWA-KWulB5p9k4YTGJyGbbdQ


# ================================================
# FLYWAY CONFIGURATION
# ================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# ORDER EXPIRATION
# Production default: 1440 minutes (24h). For demo/testing, override to 5.
order.expiration.in-person-minutes=5

spring.application.name=Bonsai_Shop
# ================================================
# SERVER
# ================================================
server.port=8080
server.forward-headers-strategy=FRAMEWORK

# ================================================
# ACTIVE PROFILE & DATABASE
# ================================================
spring.profiles.active=local
# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ================================================
# HIKARICP - CONNECTION POOL
# ================================================
# So ket noi toi da toi DB (default: 10) - Tang len de xu ly nhieu request dong thoi
spring.datasource.hikari.maximum-pool-size=20
# So ket noi toi thieu luon san sang trong pool
spring.datasource.hikari.minimum-idle=5
# Thoi gian cho toi da de lay ket noi tu pool (ms) - 30 giay
spring.datasource.hikari.connection-timeout=30000
# Thoi gian mot ket noi idle bi dong lai (ms) - 10 phut
spring.datasource.hikari.idle-timeout=600000
# Thoi gian song toi da cua mot ket noi (ms) - 30 phut
spring.datasource.hikari.max-lifetime=1800000

# ================================================
spring.thymeleaf.cache=false

# ================================================
# FILE UPLOAD (ảnh sản phẩm)
# ================================================
spring.servlet.multipart.enabled=true
# Gioi han multipart phai >= gioi han validate video trong service (100MB).
spring.servlet.multipart.max-file-size=100MB
# Mot request co the gui nhieu media, nen max-request-size lon hon max-file-size.
spring.servlet.multipart.max-request-size=300MB

# ================================================
# EMAIL CONFIG (Sử dụng Gmail SMTP)
# ================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================================================
# THÔNG BÁO LỖI
# ================================================


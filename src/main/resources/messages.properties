# Heritage Section
home.heritage.title=Di Sản Bonsai Nam Định
home.heritage.desc=Hải Hậu, Nam Định từ lâu đã được mệnh danh là cái nôi của nghệ thuật tạo hình cây cảnh truyền thống Việt Nam. Trải qua hàng thế kỷ, các thế hệ nghệ nhân đất học Hải Hậu đã thổi hồn vào những gốc cây Sanh Nam Điền mộc mạc, tạo nên những tác phẩm danh bất hư truyền. Điểm đặc trưng của nghệ thuật bonsai nơi đây là kỹ thuật ký đá tinh xảo và tạo tác dáng thế nghiêm cẩn, phản ánh cốt cách kiên cường và thanh cao của con người đất Bắc. Chơi cây nghệ thuật tại Hải Hậu không chỉ là một thú chơi tao nhã, mà đã trở thành di sản văn hóa, dòng chảy gia tộc được trao truyền qua nhiều thế hệ.
home.heritage.quote=Mỗi tác phẩm từ Minh Kỷ Garden đều mang đậm dấu ấn văn hóa và tâm huyết của các nghệ nhân đất Nam Định.

